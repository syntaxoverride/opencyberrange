site_name: "Linux Penetration Testing"
site_description: "Linux penetration testing exercises for OpenCyberRange"
site_url: ""
docs_dir: Workbook
site_dir: _site_linpt

theme:
  name: material
  palette:
    - scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js

nav:
  - Home: index.md
  - "CH L1 -- Linux Service Enumeration":
    - Introduction: CH_LIN01_Linux_Service_Enumeration/00_Introduction.md
    - "Exercise L1.1 -- SSH Service Detection": CH_LIN01_Linux_Service_Enumeration/01_SSH_Service_Detection.md
    - "Exercise L1.2 -- Multi-Service Discovery": CH_LIN01_Linux_Service_Enumeration/02_Multi_Service_Discovery.md
    - "Exercise L1.3 -- Service Interaction": CH_LIN01_Linux_Service_Enumeration/03_Service_Interaction.md
    - "Exercise L1.4 -- Non-Standard Port Discovery": CH_LIN01_Linux_Service_Enumeration/04_Non_Standard_Port_Discovery.md
    - "Exercise L1.5 -- NSE Script Enumeration": CH_LIN01_Linux_Service_Enumeration/05_NSE_Script_Enumeration.md
    - "Exercise L1.6 -- Version Vulnerability Identification": CH_LIN01_Linux_Service_Enumeration/06_Version_Vulnerability_Identification.md
    - Chapter Review: CH_LIN01_Linux_Service_Enumeration/07_Chapter_Review.md
  - "CH L2 -- SSH Authentication":
    - Introduction: CH_LIN02_SSH_Authentication/00_Introduction.md
    - "Exercise L2.1 -- SSH Basic Login": CH_LIN02_SSH_Authentication/01_SSH_Basic_Login.md
    - "Exercise L2.2 -- SSH User Discovery": CH_LIN02_SSH_Authentication/02_SSH_User_Discovery.md
    - "Exercise L2.3 -- SSH File Discovery": CH_LIN02_SSH_Authentication/03_SSH_File_Discovery.md
    - Chapter Review: CH_LIN02_SSH_Authentication/04_Chapter_Review.md
  - "CH L3 -- SSH Post-Exploitation":
    - Introduction: CH_LIN03_SSH_Post_Exploitation/00_Introduction.md
    - "Exercise L3.1 -- SSH Command Execution": CH_LIN03_SSH_Post_Exploitation/01_SSH_Command_Execution.md
    - "Exercise L3.2 -- SSH History Analysis": CH_LIN03_SSH_Post_Exploitation/02_SSH_History_Analysis.md
    - "Exercise L3.3 -- SSH Privilege Escalation": CH_LIN03_SSH_Post_Exploitation/03_SSH_Privilege_Escalation.md
    - Chapter Review: CH_LIN03_SSH_Post_Exploitation/04_Chapter_Review.md
