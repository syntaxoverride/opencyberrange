site_name: "Web Application Penetration Testing"
site_description: "Web application penetration testing exercises for OpenCyberRange"
site_url: ""
docs_dir: Workbook
site_dir: _site_webpt

theme:
  name: material
  palette:
    - scheme: slate
      primary: red
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: red
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css?v=4

extra_javascript:
  - javascripts/mermaid-fix.js?v=4
  - javascripts/pdf-export.js?v=2
  - https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js

nav:
  - Home: index.md
  - "CH W1 -- Web Reconnaissance":
    - Introduction: CH_WEB01_Web_Reconnaissance/00_Introduction.md
    - "Exercise W1.1 -- Basic Directory Enumeration": CH_WEB01_Web_Reconnaissance/01_Basic_Directory_Enumeration.md
    - "Exercise W1.2 -- Technology Identification": CH_WEB01_Web_Reconnaissance/02_Technology_Identification.md
    - "Exercise W1.3 -- HTTP Methods Enumeration": CH_WEB01_Web_Reconnaissance/03_HTTP_Methods_Enumeration.md
    - "Exercise W1.4 -- Header Analysis": CH_WEB01_Web_Reconnaissance/04_Header_Analysis.md
    - "Exercise W1.5 -- Subdomain Discovery": CH_WEB01_Web_Reconnaissance/05_Subdomain_Discovery.md
    - "Exercise W1.6 -- Comprehensive Web Reconnaissance": CH_WEB01_Web_Reconnaissance/06_Comprehensive_Web_Reconnaissance.md
    - Chapter Review: CH_WEB01_Web_Reconnaissance/07_Chapter_Review.md
  - "CH W2 -- Web Exploitation":
    - Introduction: CH_WEB02_Web_Exploitation/00_Introduction.md
    - "Exercise W2.1 -- Basic SQL Injection": CH_WEB02_Web_Exploitation/01_Basic_SQL_Injection.md
    - Chapter Review: CH_WEB02_Web_Exploitation/02_Chapter_Review.md
