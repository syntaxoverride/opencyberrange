test:
  steps:
    - name: "SSH accessible on analyst workstation"
      command: "nc -w 5 {target.analyst-workstation} 22 </dev/null | head -1"
      expect: "SSH"
    - name: "PCAP file exists on analyst workstation"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst-workstation} 'ls /home/analyst/captures/session-hijack.pcap'"
      expect: "session-hijack.pcap"
    - name: "Flag found in PCAP captures"
      command: "sshpass -p '{cred.analyst.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.analyst.user}@{target.analyst-workstation} 'strings /home/analyst/captures/*.pcap 2>/dev/null | grep -o \"OCR{[^}]*}\" | head -1'"
      expect: "OCR{s3ss10n_c00k13_st0l3n}"

    - name: "Echo confirmed flag"
      command: "echo 'OCR{s3ss10n_c00k13_st0l3n}'"
      expect: "OCR{s3ss10n_c00k13_st0l3n}"
