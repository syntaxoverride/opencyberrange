test:
  steps:
    - name: "HTTP server responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.target}/"
      expect: "200"
    - name: "Firewall log file accessible"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.target}/firewall.log"
      expect: "200"
    - name: "Flag found in firewall log"
      command: "curl -s http://{target.target}/firewall.log | grep -o 'OCR{[^}]*}'"
      expect: "OCR{p0rt_sc4n_d3t3ct3d}"
