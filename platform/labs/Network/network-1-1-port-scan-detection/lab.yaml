name: Suspicious Port Scan Detection
description: MediCare Regional Hospital's firewall is logging unusual connection attempts. As a junior SOC analyst, identify the port scanning activity and determine the attacker's pattern.
difficulty: beginner
category: network-analysis
duration_minutes: 45
objectives:
  - Analyze firewall logs for suspicious patterns
  - Identify port scanning behavior
  - Differentiate normal traffic from reconnaissance
  - Extract attacker information
  - Capture the flag

scenario: |
  You're a junior analyst at MediCare Regional Hospital's Security Operations Center (SOC).
  Marcus Thompson, the CISO, has asked you to investigate some unusual firewall logs from
  last night. The hospital's perimeter firewall recorded several connection attempts that
  may indicate reconnaissance activity.

  Port scanning is often the first step in a cyber attack. Attackers scan networks to
  identify open ports and running services before attempting exploitation. As a defender,
  recognizing these patterns is critical to early threat detection.

  Your objective: Analyze the firewall logs at 10.10.{user_id}.10 to identify the port
  scanning activity. Determine the attacker's source IP address and document the scan pattern.

flag: "OCR{p0rt_sc4n_d3t3ct3d}"

hints:
  - text: |
      **Port Scanning Fundamentals** - What defenders need to know:

      **Why attackers scan ports:**
      - Discover what services are running (HTTP, SSH, databases, etc.)
      - Identify potential entry points
      - Map the network before attacking
      - Find vulnerable or misconfigured services

      **Common scan patterns defenders see:**
      - **Sequential scanning**: Ports scanned in order (20, 21, 22, 23...)
      - **Random scanning**: Ports scanned in random order
      - **Targeted scanning**: Only specific ports (80, 443, 22)
      - **Full range scanning**: All 65,535 ports

      **What makes scans suspicious:**
      - Same source IP attempting many different ports
      - Failed connection attempts across multiple ports
      - Rapid succession of connection attempts
      - Connections to unusual/uncommon ports

      **How to spot scans in logs:**
      - Look for a single source IP with many destination ports
      - Count failed connection attempts from the same source
      - Check timestamps - scans happen quickly (seconds/minutes)
      - Normal traffic connects to specific services, scans probe many ports

      Port scans leave clear fingerprints in firewall and IDS logs.
    unlock_after_minutes: 0

  - text: |
      **Analyzing Firewall Logs** - A systematic approach:

      **Log format basics:**
      Most firewall logs include:
      - Timestamp (when the connection attempt occurred)
      - Source IP (who is connecting)
      - Source Port (which port they're connecting from)
      - Destination IP (your server/network)
      - Destination Port (which service they're trying to reach)
      - Action (ALLOW, DENY, DROP)

      **Example log entry:**
      ```
      2024-01-03 22:45:12 DENY 192.168.1.100:54321 -> 10.10.3.50:22 [SSH]
      ```
      This shows:
      - Time: 22:45:12
      - Action: DENY (blocked)
      - Source: 192.168.1.100 port 54321
      - Destination: 10.10.3.50 port 22 (SSH)

      **Analysis workflow:**
      1. **Access the logs** - Connect to the log server
      2. **Identify unique source IPs** - Which IPs appear most frequently?
      3. **Count destination ports per IP** - How many different ports is each IP trying?
      4. **Check timestamps** - Are attempts rapid and sequential?
      5. **Look for patterns** - Ascending port numbers? Random? Targeted?

      **Tools for log analysis:**
      - `cat` or `less` - View log files
      - `grep` - Search for specific IPs or ports
      - `awk` - Extract specific fields
      - `sort` and `uniq` - Find unique values and count occurrences
      - `wc -l` - Count lines/attempts

      Systematic analysis reveals patterns that indicate malicious activity.
    unlock_after_minutes: 5

  - text: |
      **Finding the Attacker** - Practical log analysis techniques:

      **Step 1: Access the logs**
      The firewall logs are available via HTTP:
      ```bash
      # View logs in browser
      http://10.10.{user_id}.10/firewall.log

      # Or download and analyze locally
      curl http://10.10.{user_id}.10/firewall.log > firewall.log
      ```

      **Step 2: Identify suspicious source IPs**
      Count how many times each IP appears:
      ```bash
      # Extract source IPs and count occurrences
      cat firewall.log | awk '{print $3}' | cut -d':' -f1 | sort | uniq -c | sort -rn
      ```

      **Step 3: Analyze a suspicious IP**
      Look at all activity from a specific IP:
      ```bash
      # Show all attempts from an IP
      grep "192.168.x.x" firewall.log

      # Count how many different ports they tried
      grep "192.168.x.x" firewall.log | awk '{print $5}' | cut -d':' -f2 | sort -u | wc -l
      ```

      **Step 4: Check for scan patterns**
      Look for:
      - Many destination ports from one source IP
      - Sequential port numbers (20, 21, 22, 23...)
      - Failed/denied connections (attackers usually don't have credentials)
      - Rapid timestamps (scans happen quickly)

      **Red flags:**
      - 50+ different ports from one IP = likely a scan
      - Connections to unusual ports (8080, 8443, 3389, etc.)
      - All DENY actions = unauthorized probing

      The attacker's IP will stand out with an unusually high number of connection attempts.
    unlock_after_minutes: 10

  - text: |
      **Command-Line Log Analysis** - Specific techniques for this lab:

      **Quick analysis commands:**

      **1. Find IPs with the most connection attempts:**
      ```bash
      curl -s http://10.10.{user_id}.10/firewall.log | \
        awk '{print $3}' | cut -d':' -f1 | sort | uniq -c | sort -rn | head -5
      ```

      **2. See what ports a specific IP targeted:**
      ```bash
      curl -s http://10.10.{user_id}.10/firewall.log | \
        grep "SUSPICIOUS_IP" | awk '{print $5}' | cut -d':' -f2 | sort -n
      ```

      **3. Count unique destination ports per IP:**
      ```bash
      curl -s http://10.10.{user_id}.10/firewall.log | \
        awk '{print $3,$5}' | cut -d':' -f1,3 | sort | uniq | awk '{print $1}' | uniq -c
      ```

      **What to look for:**
      - One IP with 20+ different destination ports = port scan
      - Sequential port numbers = systematic scanning
      - The flag is related to the attacker's information

      **Pattern recognition:**
      - Normal users: Connect to 1-3 specific services
      - Scanners: Probe dozens or hundreds of ports
      - Time frame: Scans complete in minutes, normal use is spread over time

      The attacker's IP address and scan pattern will reveal the flag.
    unlock_after_minutes: 15

  - text: |
      **Solution Approach** for MediCare's firewall logs:

      **Step-by-step walkthrough:**

      **1. Download the logs:**
      ```bash
      curl http://10.10.{user_id}.10/firewall.log -o firewall.log
      ```

      **2. Find the busiest source IP:**
      ```bash
      cat firewall.log | awk '{print $3}' | cut -d':' -f1 | sort | uniq -c | sort -rn
      ```

      Look for an IP with significantly more attempts than others (30-50+ connections).

      **3. Examine that IP's activity:**
      ```bash
      grep "ATTACKER_IP" firewall.log
      ```

      **4. Check how many ports they scanned:**
      ```bash
      grep "ATTACKER_IP" firewall.log | awk '{print $5}' | cut -d':' -f2 | sort -u | wc -l
      ```

      **5. Look for the flag:**
      The flag is embedded in the logs related to the port scanning activity. It may be:
      - In a comment field in the log entry
      - Part of the attacker's IP address pattern
      - In a summary or alert line

      **Expected findings:**
      - Attacker IP: One address with 40-50+ connection attempts
      - Ports scanned: 20-100+ different destination ports
      - Pattern: Sequential or targeted port scanning
      - Action: Most/all connections DENY (attacker doesn't have legitimate access)

      The flag will be visible once you identify and analyze the scanning activity.
    unlock_after_minutes: 20
