test:
  steps:
    - name: "HTTP server responds"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.dns-server}/"
      expect: "200"
    - name: "DNS log file accessible"
      command: "curl -s -o /dev/null -w '%{http_code}' http://{target.dns-server}/dns.log"
      expect: "200"
    - name: "Flag found in DNS log"
      command: "curl -s http://{target.dns-server}/dns.log | grep -o 'OCR{[^}]*}'"
      expect: "OCR{dns_3xf1ltr4t10n}"
