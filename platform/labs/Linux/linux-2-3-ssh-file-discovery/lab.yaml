name: SSH File Discovery
description: FinanceCorp requires thorough investigation of accessible files. Navigate directories, search for specific files, and discover information beyond the home directory.
difficulty: beginner
category: post-exploitation
duration_minutes: 120
objectives:
  - Navigate Linux file system after authentication
  - Search for files using find command
  - Explore directories beyond home directory
  - Identify readable sensitive files
  - Capture the flag

scenario: |
  Your FinanceCorp penetration test continues with file system exploration. James
  Mitchell wants you to demonstrate the risks of improper file permissions and
  sensitive data exposure across the file system.

  After gaining SSH access, comprehensive file system enumeration is critical.
  While user home directories contain personal information, system-wide directories
  often reveal more sensitive data:
  - Configuration files in /etc/
  - Application data in /var/
  - Temporary files in /tmp/
  - Web server files in /var/www/
  - Log files in /var/log/
  - Backup files scattered throughout the system

  Improper file permissions allow authenticated users to access sensitive data:
  - Database configuration files with credentials
  - Web application configuration with API keys
  - Backup files with sensitive information
  - Scripts containing hard-coded passwords
  - Documentation with system architecture

  Common file discovery techniques:
  - Recursive directory listing
  - Find command for pattern matching
  - Grep for content searching
  - Checking world-readable files
  - Exploring temporary and backup locations

  Your objective: Explore the FinanceCorp server file system, search for accessible
  files containing sensitive information, and identify configuration or backup files
  that reveal additional intelligence.

  **Test Credentials:**
  - Username: `webadmin`
  - Password: `WebServer2024#`

flag: "OCR{f1l3_d1sc0v3ry}"

hints:
  - text: |
      **File system exploration** after authentication:

      **Why file discovery matters:**
      - **Configuration files**: Database credentials, API keys
      - **Backup files**: Complete system snapshots, old passwords
      - **Temporary files**: In-progress work, forgotten sensitive data
      - **Log files**: Reveal system activity, may contain secrets
      - **Web applications**: Source code, config files, upload directories
      - **Scripts**: Automation with hard-coded credentials

      **Linux file system structure:**

      **/ (root) - Top level directory**

      **/etc/ - Configuration files:**
      - `/etc/passwd` - User account information (world-readable)
      - `/etc/shadow` - Password hashes (root only)
      - `/etc/ssh/sshd_config` - SSH server configuration
      - `/etc/mysql/` - Database configuration
      - `/etc/apache2/` - Web server configuration
      - `/etc/nginx/` - Nginx configuration

      **/home/ - User home directories:**
      - `/home/username/` - Personal files
      - Covered in previous labs

      **/var/ - Variable data:**
      - `/var/www/` - Web server document root
      - `/var/www/html/` - Default web files
      - `/var/log/` - System and application logs
      - `/var/backups/` - System backups
      - `/var/tmp/` - Temporary files (persists across reboots)

      **/tmp/ - Temporary files:**
      - World-writable directory
      - Files deleted on reboot (usually)
      - Often contains abandoned sensitive data

      **/opt/ - Optional software:**
      - Third-party applications
      - May have configuration files
      - Application-specific data

      **/usr/ - User programs:**
      - `/usr/local/` - Locally installed software
      - `/usr/share/` - Shared data files

      **/root/ - Root user home:**
      - Only accessible to root
      - Target for privilege escalation

      **Permission-based access:**
      - You can only access files your user can read
      - World-readable files: Anyone can read
      - Group-readable: Members of specific group
      - Misconfigured permissions: Security vulnerability

      **Common sensitive file locations:**

      **Web application configs:**
      - `/var/www/html/config.php`
      - `/var/www/html/wp-config.php` (WordPress)
      - `/var/www/html/.env`

      **Database configs:**
      - `/etc/mysql/my.cnf`
      - `~/.my.cnf`
      - `/var/www/html/config/database.yml`

      **Backup files:**
      - `/var/backups/`
      - `/tmp/backup.tar.gz`
      - Files ending in `.bak`, `.old`, `.backup`
      - `config.php.bak`, `database.sql.backup`

      **Temporary files:**
      - `/tmp/`
      - `/var/tmp/`
      - Files left during maintenance
      - Forgotten credentials or data dumps

      **Documentation:**
      - `/root/README.txt` (if accessible)
      - `/var/www/INSTALL.txt`
      - `notes.txt`, `TODO.txt`

      File system exploration reveals sensitive data beyond user home directories.
    unlock_after_minutes: 0

  - text: |
      **Find command** for file discovery:

      **Basic find syntax:**
      ```bash
      find [path] [criteria] [action]
      ```

      **Find by filename:**
      ```bash
      find /path -name "filename"
      ```

      **Examples:**
      ```bash
      # Find files named config.php
      find /var/www -name "config.php"

      # Find all .txt files
      find /home -name "*.txt"

      # Find all backup files
      find / -name "*.bak" 2>/dev/null

      # Find files containing "flag" in name
      find / -name "*flag*" 2>/dev/null
      ```

      **Find by file type:**
      ```bash
      # Find directories only
      find /etc -type d

      # Find files only (not directories)
      find /tmp -type f

      # Find symbolic links
      find / -type l
      ```

      **Find by permissions:**
      ```bash
      # Find world-readable files
      find / -perm -004 2>/dev/null

      # Find SUID binaries (privilege escalation)
      find / -perm -4000 2>/dev/null

      # Find SGID binaries
      find / -perm -2000 2>/dev/null
      ```

      **Find by user/group:**
      ```bash
      # Files owned by specific user
      find / -user webadmin 2>/dev/null

      # Files owned by root but world-readable
      find / -user root -perm -004 2>/dev/null
      ```

      **Find by size:**
      ```bash
      # Files larger than 10MB
      find / -size +10M 2>/dev/null

      # Files smaller than 1KB
      find / -size -1k 2>/dev/null
      ```

      **Find by modification time:**
      ```bash
      # Modified in last 7 days
      find /var/www -mtime -7

      # Modified more than 30 days ago
      find /tmp -mtime +30
      ```

      **Combining criteria:**
      ```bash
      # .php files in /var/www modified in last 7 days
      find /var/www -name "*.php" -mtime -7

      # World-readable .conf files
      find /etc -name "*.conf" -perm -004 2>/dev/null
      ```

      **Important: Error redirection**
      ```bash
      2>/dev/null
      ```
      - Redirects errors (permission denied) to /dev/null
      - Keeps output clean
      - Only shows files you can access

      **Find examples:**
      ```bash
      find / -name "config*" 2>/dev/null
      ```
      - Search entire filesystem
      - Files starting with "config"
      - Hide permission errors

      **Executing commands on found files:**
      ```bash
      # Display contents of all found files
      find /var/www -name "*.php" -exec cat {} \;

      # List details of found files
      find /tmp -name "*.bak" -exec ls -lh {} \;
      ```

      **Grep for content search:**
      ```bash
      # Find files containing "password"
      grep -r "password" /var/www 2>/dev/null

      # Find files containing "flag"
      grep -r "flag" /var/www 2>/dev/null

      # Case-insensitive search
      grep -ri "password" /etc 2>/dev/null
      ```

      **Combining find and grep:**
      ```bash
      # Find .php files and search for "password"
      find /var/www -name "*.php" -exec grep -H "password" {} \;
      ```

      Find command is essential for discovering sensitive files across the file system.
    unlock_after_minutes: 5

  - text: |
      **Exploring web application directories:**

      **Default web server locations:**

      **Apache default:**
      ```bash
      /var/www/html/
      ```

      **Nginx default:**
      ```bash
      /usr/share/nginx/html/
      /var/www/html/
      ```

      **Common web application structure:**
      ```
      /var/www/html/
      ├── index.php          # Main application file
      ├── config.php         # Configuration (often contains DB creds)
      ├── .env               # Environment variables
      ├── admin/             # Admin panel
      ├── uploads/           # User uploads (potential malicious files)
      ├── includes/          # Included files
      ├── assets/            # CSS, JS, images
      ├── backups/           # Backup files (should not be web-accessible!)
      └── .git/              # Git repository (information disclosure)
      ```

      **Navigating to web directory:**
      ```bash
      $ cd /var/www/html
      $ ls -la
      ```

      **Common sensitive files in web directories:**

      **Configuration files:**
      - `config.php` - Database credentials, API keys
      - `.env` - Environment variables (Laravel, modern frameworks)
      - `wp-config.php` - WordPress database credentials
      - `configuration.php` - Joomla configuration
      - `settings.php` - Drupal settings
      - `database.yml` - Ruby on Rails database config

      **Example config.php:**
      ```php
      <?php
      $db_host = "localhost";
      $db_user = "webapp_user";
      $db_pass = "SecretP@ssw0rd";
      $db_name = "financecorp_db";
      $api_key = "sk_live_abc123xyz789";
      ?>
      ```

      **Backup files:**
      ```bash
      # Files ending in .bak, .old, .backup
      config.php.bak
      database.sql
      site_backup.tar.gz
      ```

      **Source control disclosure:**
      ```bash
      # .git directory exposes source code
      /var/www/html/.git/

      # View git log
      cd /var/www/html/.git
      git log
      # May reveal commits with passwords
      ```

      **Exploring web directory:**
      ```bash
      $ cd /var/www/html
      $ ls -la
      total 124
      drwxr-xr-x 6 www-data www-data  4096 Jan  4 10:00 .
      drwxr-xr-x 3 root     root      4096 Dec 15 08:00 ..
      -rw-r--r-- 1 www-data www-data  2156 Jan  3 15:30 index.php
      -rw-r--r-- 1 www-data www-data   486 Jan  3 15:30 config.php
      -rw-r--r-- 1 www-data www-data   156 Jan  3 15:30 .env
      drwxr-xr-x 2 www-data www-data  4096 Jan  3 15:30 admin
      drwxr-xr-x 2 www-data www-data  4096 Jan  4 09:00 backups
      drwxr-xr-x 2 www-data www-data  4096 Jan  3 15:30 uploads

      $ cat config.php
      [database credentials and API keys revealed]
      ```

      **Backup directory investigation:**
      ```bash
      $ cd /var/www/html/backups
      $ ls -la
      -rw-r--r-- 1 www-data www-data  45678 Jan  2 02:00 db_backup.sql
      -rw-r--r-- 1 www-data www-data 123456 Jan  2 02:00 site_backup.tar.gz

      $ cat db_backup.sql
      # Contains database dump with user credentials, etc.
      ```

      **Upload directory investigation:**
      ```bash
      $ cd /var/www/html/uploads
      $ ls -la
      # May contain uploaded files, potential reverse shells
      ```

      **Finding sensitive files in web directory:**
      ```bash
      # Search for configuration files
      find /var/www -name "config*" 2>/dev/null
      find /var/www -name ".env" 2>/dev/null
      find /var/www -name "wp-config.php" 2>/dev/null

      # Search for backup files
      find /var/www -name "*.bak" 2>/dev/null
      find /var/www -name "*.sql" 2>/dev/null
      find /var/www -name "*backup*" 2>/dev/null

      # Search for files containing credentials
      grep -r "password" /var/www 2>/dev/null
      grep -r "api_key" /var/www 2>/dev/null
      grep -r "secret" /var/www 2>/dev/null
      ```

      **Why web directories are valuable:**
      - Database credentials for lateral movement
      - API keys for external service access
      - Source code reveals application logic
      - Backup files contain complete data
      - Upload directories may allow code execution

      Web application directories frequently contain configuration files with sensitive credentials.
    unlock_after_minutes: 10

  - text: |
      **Systematic file discovery approach:**

      **Step 1: Identify current access level**
      ```bash
      $ whoami
      webadmin

      $ id
      uid=1002(webadmin) gid=1002(webadmin) groups=1002(webadmin),33(www-data)
      ```
      → Member of www-data group (web server files!)

      **Step 2: Check home directory first**
      ```bash
      $ cd ~
      $ ls -la
      ```
      Quick check for obvious files

      **Step 3: Explore web server directories**
      ```bash
      $ cd /var/www/html
      $ ls -la
      ```
      - Configuration files
      - Application code
      - Backup directories

      **Step 4: Search for common sensitive files**
      ```bash
      # Configuration files
      find /var/www -name "config.php" 2>/dev/null
      find /var/www -name ".env" 2>/dev/null
      find /var/www -name "wp-config.php" 2>/dev/null

      # Backup files
      find /var/www -name "*.bak" 2>/dev/null
      find /var/www -name "*.sql" 2>/dev/null
      find /var/www -name "*backup*" 2>/dev/null

      # Files with "flag" in name
      find /var/www -name "*flag*" 2>/dev/null
      find / -name "*flag*" 2>/dev/null
      ```

      **Step 5: Explore specific directories**
      ```bash
      # Web root
      ls -la /var/www/html/

      # Backups directory
      ls -la /var/www/html/backups/ 2>/dev/null

      # Config directory
      ls -la /var/www/html/config/ 2>/dev/null

      # Temporary files
      ls -la /tmp/
      ls -la /var/tmp/
      ```

      **Step 6: Read discovered files**
      ```bash
      $ cat /var/www/html/config.php
      $ cat /var/www/html/.env
      $ cat /var/www/html/backups/notes.txt
      ```

      **Step 7: Grep for keywords**
      ```bash
      # Search for "flag"
      grep -r "flag" /var/www 2>/dev/null

      # Search for "password"
      grep -r "password" /var/www 2>/dev/null

      # Search for credentials
      grep -r "db_pass" /var/www 2>/dev/null
      ```

      **Priority targets:**

      **High priority (check first):**
      1. `/var/www/html/config.php`
      2. `/var/www/html/.env`
      3. `/var/www/html/backups/`
      4. `/var/www/html/wp-config.php`

      **Medium priority:**
      1. `/etc/mysql/` (if readable)
      2. `/tmp/` and `/var/tmp/`
      3. Other user home directories
      4. `/opt/` for third-party apps

      **Low priority:**
      1. `/var/log/` (logs, large files)
      2. `/usr/share/` (documentation, examples)

      **Common file discovery patterns:**

      **Finding database credentials:**
      ```bash
      $ find /var/www -name "config.php" -exec cat {} \;
      # or
      $ grep -r "db_pass" /var/www 2>/dev/null
      ```

      **Finding API keys:**
      ```bash
      $ grep -r "api_key" /var/www 2>/dev/null
      $ grep -r "secret_key" /var/www 2>/dev/null
      ```

      **Finding backup files:**
      ```bash
      $ find /var/www -name "*.bak" -o -name "*.sql" 2>/dev/null
      ```

      **World-readable sensitive files:**
      ```bash
      $ find /etc -name "*.conf" -perm -004 2>/dev/null
      ```

      **Files modified recently (may be working files):**
      ```bash
      $ find /var/www -type f -mtime -7 2>/dev/null
      ```

      Systematic file discovery reveals sensitive configuration and backup files.
    unlock_after_minutes: 15

  - text: |
      To discover sensitive files on FinanceCorp's server:

      **Step 1: Authenticate**
      ```bash
      ssh webadmin@<target>
      ```
      - Username: `webadmin`
      - Password: `WebServer2024#`

      **Step 2: Check identity and groups**
      ```bash
      whoami
      id
      ```
      Note group memberships (www-data group = web server access)

      **Step 3: Navigate to web directory**
      ```bash
      cd /var/www/html
      ls -la
      ```

      **Step 4: Look for common files**
      ```bash
      # Configuration files
      ls -la config.php
      ls -la .env
      cat config.php
      cat .env
      ```

      **Step 5: Check subdirectories**
      ```bash
      # Backups directory
      ls -la backups/
      cd backups/
      ls -la

      # Config directory
      ls -la config/
      cd config/
      ls -la
      ```

      **Step 6: Use find for specific files**
      ```bash
      # Find all .txt files in web directory
      find /var/www -name "*.txt" 2>/dev/null

      # Find files with "flag" in name
      find /var/www -name "*flag*" 2>/dev/null

      # Find backup files
      find /var/www -name "*.bak" 2>/dev/null
      ```

      **Step 7: Read discovered files**
      ```bash
      cat <filename>
      ```

      **Expected file locations for this lab:**
      - `/var/www/html/` - Main web directory
      - `/var/www/html/config.php` - Configuration
      - `/var/www/html/backups/` - Backup directory
      - `/var/www/html/backups/*.txt` - Text files
      - Files may contain credentials, notes, or the flag

      **Useful commands:**
      ```bash
      # Navigate to web root
      cd /var/www/html

      # List all including hidden
      ls -la

      # Find specific files
      find . -name "*.txt"

      # Search file contents
      grep -r "flag" .
      ```

      **Important notes:**
      - webadmin user has access to /var/www/ directory
      - The flag is in a file within the web directory structure
      - Use `find` and `ls` to locate files
      - Read files with `cat`

      The flag is in a file within the /var/www/html/ directory structure.
    unlock_after_minutes: 20

