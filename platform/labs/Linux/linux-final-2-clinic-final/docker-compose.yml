services:
  clinic-fs:
    mem_limit: 512m
    cpus: 0.5
    build:
      context: ./containers/clinic-fs
      dockerfile: Dockerfile
    hostname: pinecrest-fs01
    labels:
      ip_offset: "10"
    restart: unless-stopped

  clinic-portal:
    mem_limit: 512m
    cpus: 0.5
    build:
      context: ./containers/clinic-portal
      dockerfile: Dockerfile
    hostname: pinecrest-staff
    labels:
      ip_offset: "11"
    restart: unless-stopped
