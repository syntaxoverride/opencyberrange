user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 768; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80 default_server;
    root /var/www/html;
    index index.html;

    # Main intranet pages
    location / {
      try_files $uri $uri/ =404;
    }

    # Staff directory
    location /staff/ {
      alias /var/www/html/staff/;
      index index.html;
    }

    # IT Notices
    location /notices/ {
      alias /var/www/html/notices/;
      index index.html;
    }

    # Policies
    location /policies/ {
      alias /var/www/html/policies/;
      index index.html;
    }

    # Contact
    location /contact/ {
      alias /var/www/html/contact/;
      index index.html;
    }

    # Backups root. restricted
    location /backups/ {
      deny all;
      return 403;
    }

    # Legacy backups. misconfigured: should be restricted but is not
    location /backups/legacy/ {
      alias /var/www/html/backups/legacy/;
      index index.html;
      autoindex off;
    }
  }
}
