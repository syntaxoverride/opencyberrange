user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    # Honeypot web service. accepts all requests so Suricata can
    # observe complete HTTP transactions and parse payloads.
    # Returns login_failed for most requests, login_success for
    # requests with the campaign marker (simulates auth gateway).
    access_log off;

    server {
        listen 80 default_server;
        server_name ids-sensor;

        # Return 200 with login response for any path so HTTP
        # transactions complete fully and Suricata's HTTP parser
        # can extract headers, URIs, and bodies.
        location / {
            return 200 '{"status":"login_failed","service":"Aegis Security Corp Auth Gateway","version":"2.4.1","message":"Invalid credentials"}';
            add_header Content-Type application/json;
        }
    }
}
