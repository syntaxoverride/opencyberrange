test:
  steps:
    - name: "Verify SSH port is open"
      command: "nc -z -w 5 {target.target} 22 && echo 'port_open'"
      expect: "port_open"
    - name: "Grab SSH banner"
      command: "nc -w 5 {target.target} 22 </dev/null | head -1"
      expect: "SSH"
    - name: "Run NSE scripts against SSH service"
      command: "nmap -Pn -n -p 22 --script=ssh-auth-methods {target.target} 2>&1"
      expect: "ssh-auth-methods"
    - name: "Retrieve flag via SSH (password auth confirmed by NSE)"
      command: "sshpass -p 'techstart2024' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null student@{target.target} 'cat /home/student/flag.txt'"
      expect: "OCR{nse_scr1pt}"
