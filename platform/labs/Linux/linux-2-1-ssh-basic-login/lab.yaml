credentials:
  - username: "financecorp"
    password: "Welcome2024#"
    role: "ssh-user"
    description: "SSH login credentials for FinanceCorp server"

workbook: "wiki/range/linpt/CH_LIN02_SSH_Authentication/01_SSH_Basic_Login/"

test:
  steps:
    - name: "Verify SSH port is open"
      command: "nc -z -w 5 {target.target} 22 && echo 'port_open'"
      expect: "port_open"
    - name: "SSH banner check"
      command: "nc -w 5 {target.target} 22 </dev/null | head -1"
      expect: "SSH"
    - name: "SSH login and retrieve MOTD flag"
      command: "sshpass -p '{cred.ssh-user.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.ssh-user.user}@{target.target} 'cat /etc/motd 2>/dev/null; echo; cat /home/*/flag.txt 2>/dev/null; grep -r OCR /etc/motd /home/ 2>/dev/null' 2>/dev/null"
      expect: "OCR{m0td_1nf0}"
