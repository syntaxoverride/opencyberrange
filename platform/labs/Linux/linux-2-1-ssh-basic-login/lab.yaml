name: SSH Basic Login
description: FinanceCorp requires testing SSH authentication. Successfully authenticate to the Linux server and observe the login welcome message.
difficulty: beginner
category: authentication
duration_minutes: 120
objectives:
  - Understand SSH authentication basics
  - Successfully authenticate to SSH service
  - Read and analyze MOTD (Message of the Day)
  - Understand post-authentication information disclosure
  - Capture the flag

scenario: |
  Your FinanceCorp penetration test has identified SSH services running on Linux
  servers. James Mitchell has provided test credentials for authentication testing,
  as weak password policies are a concern for the organization.

  SSH (Secure Shell) is the primary method for remote Linux administration. While
  the protocol itself is secure, weak passwords, default credentials, or poor
  configuration can lead to unauthorized access.

  When a user successfully authenticates to an SSH server, they typically see:
  - **Pre-login banner**: Before authentication (warnings, legal notices)
  - **MOTD (Message of the Day)**: After successful authentication
  - **Shell prompt**: Interactive command line

  The MOTD often contains system information, administrative messages, or custom
  welcome text. Sometimes, administrators inadvertently include sensitive
  information in MOTD messages.

  Your objective: Use the provided credentials to authenticate to FinanceCorp's
  SSH server. Read the complete MOTD and any post-login messages to gather
  information about the system.

  **Test Credentials:**
  - Username: `financecorp`
  - Password: `Welcome2024#`

flag: "OCR{m0td_1nf0}"

hints:
  - text: |
      **SSH Authentication** is the gateway to Linux system access:

      **Authentication methods:**
      - **Password**: Traditional username/password
      - **Public key**: Cryptographic key pairs (more secure)
      - **Keyboard-interactive**: Challenge-response
      - **GSSAPI**: Kerberos-based authentication
      - **Certificate**: SSH certificates

      **Why password authentication testing matters:**
      - **Weak passwords**: Common passwords are easily guessed
      - **Default credentials**: Vendors ship with default accounts
      - **Password reuse**: Same password across multiple systems
      - **Brute force**: Automated password guessing
      - **Credential stuffing**: Using leaked password databases

      **SSH connection process:**
      1. **Connection**: Client connects to server port 22
      2. **Key exchange**: Secure channel established
      3. **Server authentication**: Host key verification
      4. **User authentication**: Username/password or key
      5. **Session establishment**: Shell access granted
      6. **MOTD display**: Welcome message shown
      7. **Shell prompt**: Interactive access

      **Pre-authentication vs post-authentication:**

      **Pre-authentication (before login):**
      - Warning banners
      - Legal notices
      - No sensitive information should be here
      - Visible to anyone connecting

      **Post-authentication (after login):**
      - MOTD (Message of the Day)
      - System information
      - Administrative notices
      - Last login information
      - Only visible to authenticated users

      **Information disclosure through MOTD:**
      - System version and patch level
      - Administrative contacts
      - Maintenance schedules
      - Network topology information
      - Custom messages from administrators
      - Sometimes: Passwords, keys, or sensitive data (misconfiguration)

      **Security considerations:**
      - Strong passwords reduce brute force success
      - Public key auth eliminates password attacks
      - Failed login attempts should be logged
      - Account lockout policies prevent brute force
      - MOTD should not contain sensitive information

      **Penetration testing value:**
      - Tests password strength policies
      - Identifies default credentials
      - Discovers information disclosure
      - Assesses authentication security
      - Establishes system access for further testing

      Successful SSH authentication provides system access and post-login information.
    unlock_after_minutes: 0

  - text: |
      **SSH client usage** for authentication testing:

      **Basic SSH connection syntax:**
      ```bash
      ssh username@hostname
      ```
      or
      ```bash
      ssh username@IP_address
      ```

      **SSH with explicit port:**
      ```bash
      ssh -p 22 username@hostname
      ```
      (Port 22 is default, -p flag used for non-standard ports)

      **Authentication process:**
      ```bash
      $ ssh financecorp@<target_ip>

      The authenticity of host '<target_ip>' can't be established.
      ECDSA key fingerprint is SHA256:abc123...
      Are you sure you want to continue connecting (yes/no)? yes

      Warning: Permanently added '<target_ip>' (ECDSA) to known hosts.
      financecorp@<target_ip>'s password: [enter password]

      [MOTD appears here after successful authentication]

      financecorp@server:~$
      ```

      **First-time connection:**
      - SSH shows host key fingerprint
      - Asks for confirmation (type "yes")
      - Adds host to `~/.ssh/known_hosts`
      - Prevents MITM attacks on future connections

      **Password entry:**
      - Prompt: `username@host's password:`
      - Type password (no visual feedback)
      - Press Enter
      - Authentication succeeds or fails

      **Failed authentication:**
      ```
      Permission denied, please try again.
      ```
      - Wrong username or password
      - Account locked
      - Authentication method not allowed

      **Successful authentication:**
      - MOTD displays (if configured)
      - Last login information shown
      - Shell prompt appears
      - Can execute commands

      **Reading MOTD:**
      - Displayed automatically after login
      - Scrolls past quickly on long messages
      - Read carefully for information
      - May contain administrative notes

      **SSH client options:**
      - `-v`: Verbose (debugging connection issues)
      - `-p <port>`: Specify port (for non-standard ports)
      - `-i <keyfile>`: Use specific private key
      - `-l <username>`: Alternative username specification

      **Alternative syntax:**
      ```bash
      ssh -l financecorp <target_ip>
      ```
      Equivalent to:
      ```bash
      ssh financecorp@<target_ip>
      ```

      **After connection:**
      - You have interactive shell access
      - Can execute commands
      - Navigate file system
      - Type `exit` or `logout` to disconnect

      SSH authentication provides access to the remote system and displays post-login messages.
    unlock_after_minutes: 5

  - text: |
      **MOTD (Message of the Day)** analysis:

      **What is MOTD:**
      - Text displayed after successful SSH login
      - Configured by system administrators
      - Can be static file or dynamically generated
      - Provides information to authenticated users

      **MOTD file locations:**
      - **Static MOTD**: `/etc/motd`
      - **Dynamic MOTD**: Scripts in `/etc/update-motd.d/`
      - **Pre-login banner**: `/etc/issue.net` (before authentication)

      **Common MOTD content:**
      - Welcome message
      - System information (hostname, OS, kernel)
      - Last login details
      - Administrative announcements
      - Maintenance schedules
      - Support contact information
      - Security warnings

      **Example MOTD:**
      ```
      Welcome to FinanceCorp Production Server
      ========================================

      Hostname: fin-prod-01
      OS: Ubuntu 20.04.3 LTS
      Kernel: 5.4.0-96-generic

      For support, contact: it@financecorp.local

      NOTICE: All activity is monitored and logged.
      Unauthorized access is prohibited.
      ```

      **Information disclosure risks:**

      **Beneficial information for attackers:**
      - **OS version**: Identifies kernel exploits
      - **Hostname**: Network topology understanding
      - **Kernel version**: Local privilege escalation research
      - **Software versions**: Vulnerability identification
      - **Network information**: IP addresses, subnets, gateways
      - **Administrative contacts**: Social engineering targets
      - **Maintenance windows**: Optimal attack timing

      **Sensitive data sometimes found:**
      - Default passwords in "temporary" notices
      - Internal IP addresses and network ranges
      - Detailed system configurations
      - Application versions and paths
      - Backup schedules and locations
      - Development/staging server information

      **Security best practices for MOTD:**
      - Generic welcome message only
      - No system version information
      - No network topology details
      - Legal notice/warning only
      - Remove default/sample MOTDs

      **Penetration testing value:**
      - Confirms successful authentication
      - Gathers system information
      - Identifies OS and kernel versions
      - Discovers administrative procedures
      - May reveal sensitive information
      - Informs privilege escalation strategy

      **After reading MOTD:**
      - Document all information
      - Note system versions for vulnerability research
      - Look for administrative notes
      - Check for sensitive data
      - Use information for next steps

      **Exiting SSH session:**
      ```bash
      exit
      ```
      or
      ```bash
      logout
      ```
      or press `Ctrl+D`

      MOTD provides valuable post-authentication intelligence about the target system.
    unlock_after_minutes: 10

  - text: |
      **SSH authentication workflow** for FinanceCorp:

      **Step 1: Identify SSH service**
      From previous enumeration:
      - SSH running on port 22
      - Service: OpenSSH
      - Authentication methods available

      **Step 2: Prepare credentials**
      Test credentials provided:
      - **Username**: `financecorp`
      - **Password**: `Welcome2024#`

      **Step 3: Initiate SSH connection**
      ```bash
      ssh financecorp@<target>
      ```

      **Step 4: Accept host key (first connection)**
      ```
      The authenticity of host '<target>' can't be established.
      ECDSA key fingerprint is SHA256:...
      Are you sure you want to continue connecting (yes/no)? yes
      ```
      Type: `yes` and press Enter

      **Step 5: Enter password**
      ```
      financecorp@<target>'s password:
      ```
      Type: `Welcome2024#` and press Enter
      (No visual feedback while typing password)

      **Step 6: Successful authentication**
      - MOTD displays
      - System information shown
      - Shell prompt appears

      **Step 7: Read MOTD completely**
      - Scroll back if message is long
      - Note all information
      - Look for administrative messages
      - Document system details

      **Step 8: Document findings**
      - Authentication successful (confirms credentials work)
      - System information from MOTD
      - Any sensitive data disclosed
      - Administrative contacts or procedures

      **Common issues and solutions:**

      **Issue: Connection refused**
      ```
      ssh: connect to host X.X.X.X port 22: Connection refused
      ```
      - SSH not running
      - Firewall blocking
      - Wrong IP address

      **Issue: Permission denied**
      ```
      Permission denied, please try again.
      ```
      - Wrong password
      - Wrong username
      - Account disabled

      **Issue: Host key verification failed**
      ```
      WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!
      ```
      - Server key changed (security risk or legitimate change)
      - Remove old key: `ssh-keygen -R <hostname>`

      **Successful connection workflow:**
      ```bash
      $ ssh financecorp@<target_ip>
      [host key verification]
      yes
      [password prompt]
      Welcome2024#
      [MOTD displays with system information and flag]
      financecorp@server:~$
      ```

      Use the provided credentials to authenticate and read the complete MOTD.
    unlock_after_minutes: 15

  - text: |
      To authenticate to FinanceCorp's SSH server:

      **Command:**
      ```bash
      ssh financecorp@<target>
      ```

      **Credentials:**
      - **Username**: `financecorp`
      - **Password**: `Welcome2024#`

      **Expected interaction:**

      **1. Connection initiation:**
      ```bash
      $ ssh financecorp@<target_IP>
      ```

      **2. Host key verification (first connection):**
      ```
      The authenticity of host '<target_IP>' can't be established.
      ECDSA key fingerprint is SHA256:...
      Are you sure you want to continue connecting (yes/no/[fingerprint])?
      ```
      **Type**: `yes` and press Enter

      **3. Password prompt:**
      ```
      Warning: Permanently added '<target_IP>' (ECDSA) to the list of known hosts.
