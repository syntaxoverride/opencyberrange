  - text: |
      Successful SSH authentication and MOTD analysis:

      ```bash
      $ ssh financecorp@<target_ip>

      The authenticity of host '<target_ip> (<target_ip>)' can't be established.
      ECDSA key fingerprint is SHA256:xK3fG7hN2mP9qR4sT5vW6xY7zA1bC2dE3fG4hI5jK6l.
      Are you sure you want to continue connecting (yes/no/[fingerprint])? yes

      Warning: Permanently added '<target_ip>' (ECDSA) to the list of known hosts.
      financecorp@<target_ip>'s password: [Welcome2024#]

      ================================================================================
                          Welcome to FinanceCorp Linux Server
      ================================================================================

