      **Flag location: MOTD**
      - **Appears**: After successful authentication
      - **Location**: In the Message of the Day
      - **Flag**: `OCR{...}`
      - **Context**: Displayed among system information

      **MOTD analysis:**

      **System information gathered:**
      - **Hostname**: `fin-prod-web-01`
      - **OS**: Ubuntu 20.04.3 LTS
      - **Kernel**: 5.4.0-96-generic
      - **Uptime**: 47 days (system stability indicator)

      **Administrative contacts:**
      - IT Support: it@financecorp.local
      - Security: security@financecorp.local
      (Useful for social engineering or reporting findings)

      **Security notice:**
      - Activity monitored and logged
      - Standard warning for users
      - Indicates logging may be active

      **Last login information:**
      - Previous login: Fri Jan 3 14:23:11 2025
      - Source IP: 10.10.14.5
      - Helps detect unauthorized access

      **Critical lessons:**

      **1. Post-authentication information disclosure:**
      - MOTD only visible after successful login
      - Contains system details not in pre-auth banner
      - Provides intelligence for privilege escalation

      **2. Information value for attackers:**

      **OS and kernel version (Ubuntu 20.04.3, kernel 5.4.0-96):**
      - Research: `searchsploit linux kernel 5.4`
      - Privilege escalation vulnerabilities
      - Local exploits for this specific version

      **Hostname (fin-prod-web-01):**
      - Indicates production web server
      - Naming convention reveals network structure
      - Suggests other servers: fin-prod-web-02, fin-prod-db-01, etc.

      **Uptime (47 days):**
      - System hasn't been recently patched/rebooted
      - May be missing security updates
      - Stable target for exploitation

      **3. Credential validation:**
      - Test credentials work: `financecorp:Welcome2024#`
      - Weak password pattern (Welcome + Year + #)
      - Suggests password policy may be predictable
      - Could try variations: Welcome2025#, Welcome2023#

      **4. Next steps after authentication:**
      With valid SSH access, penetration tester would:
      - Enumerate user privileges: `id`, `sudo -l`
      - Search for sensitive files
      - Check for SUID binaries
      - Attempt privilege escalation
      - Lateral movement to other systems

      **Real-world MOTD examples:**

      **Good MOTD (minimal information):**
      ```
      Welcome to Production Server
      Unauthorized access is prohibited.
      All activity is logged.
      ```

      **Bad MOTD (too much information):**
      ```
      Welcome to Database Server (db-prod-01)
      Ubuntu 18.04 (kernel 4.15.0-old-vulnerable)
      Backup server: 10.internal.corp/backups
      Admin password temporarily: Admin123# (change after first login)
      ```

      **5. Professional penetration testing practice:**

      **Documentation:**
      ```
      Service: SSH (OpenSSH)
      Port: 22/TCP
      Credentials: financecorp:Welcome2024#
      Access Level: User shell access
      Hostname: fin-prod-web-01
      OS: Ubuntu 20.04.3 LTS
      Kernel: 5.4.0-96-generic

      Findings:
      - Weak password policy (predictable pattern)
      - Information disclosure via MOTD
      - Kernel version suggests privilege escalation potential
      - Hostname reveals network architecture

      Recommendations:
      - Implement strong password policy
      - Minimize information in MOTD
      - Keep kernel updated
      - Use public key authentication
      - Implement MFA for SSH access
      ```

      **6. SSH authentication security:**

      **Current state (weak):**
      - Password authentication enabled
      - Weak password pattern
      - No MFA
      - Verbose MOTD

      **Secure configuration:**
      - Public key authentication only
      - No password authentication
      - MFA required
      - Minimal MOTD information
      - Failed login attempt monitoring
      - Account lockout policies

      **7. Command to exit:**
      ```bash
      financecorp@fin-prod-web-01:~$ exit
      logout
      Connection to <target_ip> closed.
      ```

      The flag demonstrates successful SSH authentication and highlights the
      intelligence-gathering value of post-login MOTD messages. In real penetration
      testing, this system information guides privilege escalation and further
      exploitation strategies.
