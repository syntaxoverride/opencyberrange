      $ env
      $ printenv
      $ env | grep -i pass
      $ env | grep -i key
      ```

      **Step 6: File system**
      ```bash
      $ df -h
      $ mount
      $ ls -la /
      $ ls -la /usr/local/bin/
      ```

      **Step 7: Custom scripts or commands**
      ```bash
      # Check common locations
      $ ls -la /usr/local/bin/
      $ ls -la ~/bin/
      $ ls -la /opt/

      # Find executables
      $ find /usr/local/bin -type f -executable 2>/dev/null
      $ find ~ -type f -executable 2>/dev/null

