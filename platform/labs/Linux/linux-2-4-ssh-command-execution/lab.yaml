      ```

      **Important note:**
      The flag may be revealed through:
      - Environment variable output (`env`)
      - Custom script execution
      - Command-generated content
      - Dynamic system information

      Commands can reveal information not stored in static files.
    unlock_after_minutes: 15

  - text: |
      To enumerate the FinanceCorp system via command execution:

      **Step 1: Authenticate**
      ```bash
      ssh sysadmin@<target>
      ```
      - Username: `sysadmin`
      - Password: `SysAdmin2024#`

      **Step 2: Basic enumeration**
      ```bash
      whoami
      id
      hostname
      uname -a
      ```

      **Step 3: Check environment variables**
      ```bash
      env
      ```
      - Look through all environment variables
      - Search for sensitive information
      - Flag may be in environment

      **Step 4: Check for custom scripts**
      ```bash
      ls -la /usr/local/bin/
      ls -la ~/bin/
      ```

      **Step 5: Execute any found scripts**
      ```bash
      /usr/local/bin/script-name
      ```

      **Step 6: Search command output**
      ```bash
      env | grep -i flag
      env | grep -i ocr
      ```

      **Common commands to try:**
      ```bash
      # Environment variables
      env
      printenv
      echo $FLAG

      # Custom scripts
      /usr/local/bin/system-check
      /usr/local/bin/system-info
      /usr/local/bin/status

      # Process info (less likely but possible)
      ps aux | grep flag
      ```

      **Expected locations:**
      - Environment variable (most likely)
      - Custom script output
      - Generated command output

      **Tips:**
      - Read all `env` output carefully
      - Execute any custom scripts found
      - The flag is revealed through command execution, not file reading

      The flag is accessible through command execution (environment variables or custom scripts).
