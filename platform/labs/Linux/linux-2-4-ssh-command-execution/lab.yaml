      $ ./script.sh
      ```

      **Step 8: Search for specific information**
      ```bash
      # Search for "flag" in command output
      $ env | grep -i flag
      $ ps aux | grep -i flag

      # Search for credentials
      $ env | grep -i pass
      $ env | grep -i secret
      ```

      **For FinanceCorp assessment:**

      **After SSH authentication:**
      ```bash
      $ ssh sysadmin@<target>
      [authenticate with SysAdmin2024#]

      $ whoami
      sysadmin

      $ id
      [check groups and privileges]

      $ env
      [look for environment variables]

