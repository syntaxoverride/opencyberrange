test:
  steps:
    - name: "Verify SSH port is open"
      command: "nc -z -w 5 {target.target} 22 && echo 'port_open'"
      expect: "port_open"
    - name: "SSH banner check"
      command: "nc -w 5 {target.target} 22 </dev/null | head -1"
      expect: "SSH"
    - name: "SSH login and retrieve flag from environment variable"
      command: "sshpass -p '{cred.ssh-user.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.ssh-user.user}@{target.target} 'env | grep OCR 2>/dev/null || echo $SECURITY_ASSESSMENT_FLAG' 2>/dev/null"
      expect: "OCR{cmd_3x3c}"
