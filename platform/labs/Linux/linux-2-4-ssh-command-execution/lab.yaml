name: SSH Command Execution
description: FinanceCorp requires testing command execution capabilities. Execute specific commands after SSH authentication to gather system intelligence and discover hidden information.
difficulty: beginner
category: post-exploitation
duration_minutes: 120
objectives:
  - Execute commands via SSH interactive session
  - Run system enumeration commands
  - Execute commands to reveal hidden information
  - Understand command output analysis
  - Capture the flag

scenario: |
  Your FinanceCorp penetration test continues with active system enumeration through
  command execution. James Mitchell wants you to demonstrate what information can be
  gathered through authorized command execution.

  After gaining SSH access, executing specific commands reveals system intelligence:
  - System information (kernel, OS version, architecture)
  - Running processes and services
  - Network configuration and connections
  - User and group information
  - Installed software and versions
  - Security configurations
  - Hidden or system-generated content

  Some information is only revealed through command execution, not file reading:
  - Process lists show running services
  - Network statistics reveal connections
  - System calls display real-time activity
  - Environment variables expose configuration
  - Command substitution reveals dynamic data

  Certain commands may generate or display information that isn't stored in static
  files. For example:
  - `ps` shows current processes
  - `netstat` displays active connections
  - `env` shows environment variables
  - `date` displays current time
  - Custom scripts generate dynamic output

  Your objective: Authenticate to FinanceCorp's SSH server and execute specific
  commands to enumerate the system. Some commands may reveal information that isn't
  available through simple file reading.

  **Test Credentials:**
  - Username: `sysadmin`
  - Password: `SysAdmin2024#`

flag: "OCR{cmd_3x3c}"

hints:
  - text: |
      **Command execution** for system enumeration:

      **Why command execution matters:**
      - **Dynamic information**: Process lists, network connections change over time
      - **System state**: Current configuration, running services
      - **Privilege enumeration**: What can this user do?
      - **Hidden information**: Generated content, computed values
      - **Security assessment**: Identify weaknesses through system state

      **Categories of enumeration commands:**

      **1. System information:**
      - `uname -a`: Complete system information
      - `hostname`: System hostname
      - `cat /etc/os-release`: OS version details
      - `cat /proc/version`: Kernel version
      - `lsb_release -a`: Distribution information
      - `arch`: System architecture

      **2. User and privilege information:**
      - `whoami`: Current username
      - `id`: User ID and groups
      - `sudo -l`: Sudo privileges
      - `groups`: Group memberships
      - `cat /etc/passwd`: All system users
      - `cat /etc/group`: All system groups

      **3. Process enumeration:**
      - `ps aux`: All running processes
      - `ps -ef`: Alternative process listing
      - `top`: Real-time process monitor
      - `pstree`: Process tree
      - `systemctl status`: Service status

      **4. Network information:**
      - `ifconfig`: Network interfaces (deprecated)
      - `ip addr`: Network interfaces (modern)
      - `netstat -tulpn`: Listening ports
      - `ss -tulpn`: Socket statistics (modern)
      - `route`: Routing table
      - `arp -a`: ARP table

      **5. File system and storage:**
      - `df -h`: Disk space usage
      - `mount`: Mounted file systems
      - `lsblk`: Block devices
      - `findmnt`: Find mounts

      **6. Environment and variables:**
      - `env`: Environment variables
      - `printenv`: Print environment
      - `echo $PATH`: Specific variable
      - `set`: All shell variables

      **7. Software and packages:**
      - `dpkg -l`: Installed packages (Debian/Ubuntu)
      - `rpm -qa`: Installed packages (RHEL/CentOS)
      - `which <program>`: Locate program
      - `whereis <program>`: Find program and man pages

      **8. Security enumeration:**
      - `sudo -l`: Sudo permissions
      - `getcap -r / 2>/dev/null`: Capabilities
      - `find / -perm -4000 2>/dev/null`: SUID binaries
      - `cat /etc/sudoers`: Sudoers configuration (if readable)

      **Commands with security implications:**
      - `ps aux | grep root`: Root processes
      - `netstat -tulpn | grep LISTEN`: Listening services
      - `crontab -l`: User cron jobs
      - `cat /etc/crontab`: System cron jobs
      - `systemctl list-timers`: Systemd timers

      **Command output analysis:**
      - Read complete output carefully
      - Look for unusual services or processes
      - Note privileged processes accessible to user
      - Identify network listeners
      - Check for scheduled tasks

      Command execution reveals dynamic system state and hidden information.
    unlock_after_minutes: 0

  - text: |
      **Basic Linux command execution:**

      **Running commands in SSH session:**
      ```bash
      $ ssh user@target
      [authentication]
      user@server:~$ command
      [output]
      ```

      **System information commands:**

      **uname - System information:**
      ```bash
      $ uname -a
      Linux fin-prod-01 5.4.0-96-generic #108-Ubuntu SMP Mon Jan 17 12:09:42 UTC 2022 x86_64 x86_64 x86_64 GNU/Linux
      ```
      - Kernel name: Linux
      - Hostname: fin-prod-01
      - Kernel version: 5.4.0-96-generic
      - Architecture: x86_64

      **hostname - System name:**
      ```bash
      $ hostname
      fin-prod-01
      ```

      **OS release information:**
      ```bash
      $ cat /etc/os-release
      NAME="Ubuntu"
      VERSION="20.04.3 LTS (Focal Fossa)"
      ID=ubuntu
      ID_LIKE=debian
      PRETTY_NAME="Ubuntu 20.04.3 LTS"
      ```

      **Process enumeration:**

      **ps aux - All processes:**
      ```bash
      $ ps aux
      USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND
      root         1  0.0  0.1  16988  7824 ?        Ss   Dec15   0:03 /sbin/init
      root       834  0.0  0.2  12344  9876 ?        Ss   Dec15   0:12 /usr/sbin/sshd
      mysql     1234  0.5  5.2 123456 54321 ?        Ssl  Dec15  12:34 /usr/sbin/mysqld
      ```
      - Shows all running processes
      - User, CPU, memory, command
      - Identifies services (sshd, mysql, apache, etc.)

      **Filtering process output:**
      ```bash
      $ ps aux | grep mysql
      mysql     1234  0.5  5.2 123456 54321 ?        Ssl  Dec15  12:34 /usr/sbin/mysqld
      ```

      **Network enumeration:**

      **Active network connections:**
      ```bash
      $ netstat -tulpn
      Proto Recv-Q Send-Q Local Address           Foreign Address         State       PID/Program name
      tcp        0      0 0.0.0.0:22              0.0.0.0:*               LISTEN      834/sshd
      tcp        0      0 127.0.0.1:3306          0.0.0.0:*               LISTEN      1234/mysqld
      tcp        0      0 0.0.0.0:80              0.0.0.0:*               LISTEN      2345/apache2
      ```
      - Shows listening services
      - Port numbers and programs
      - Identifies attack surface

      **IP addresses:**
      ```bash
      $ ip addr
      1: lo: <LOOPBACK,UP,LOWER_UP>
          inet 127.0.0.1/8 scope host lo
      2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>
          inet 10.10.10.50/24 brd 10.10.10.255 scope global eth0
      ```
      - Shows IP configuration
      - Network interfaces
      - Subnet information

      **Environment variables:**

      **Display all environment variables:**
      ```bash
      $ env
      HOME=/home/sysadmin
      USER=sysadmin
      PATH=/usr/local/bin:/usr/bin:/bin
      SHELL=/bin/bash
      PWD=/home/sysadmin
      ```

      **Specific variable:**
      ```bash
      $ echo $HOME
      /home/sysadmin

      $ echo $PATH
      /usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games
      ```

      **Command chaining:**
      ```bash
      # Run multiple commands sequentially
      $ uname -a; hostname; whoami

      # Run if previous succeeds
      $ cd /tmp && ls -la

      # Pipe output to another command
      $ ps aux | grep mysql
      ```

      **Redirecting output:**
      ```bash
      # Save output to file
      $ ps aux > /tmp/processes.txt

      # Append to file
      $ ps aux >> /tmp/processes.txt

      # Search output
      $ ps aux | grep root
      ```

      Commands reveal dynamic system information unavailable through static file reading.
    unlock_after_minutes: 5

  - text: |
      **Analyzing command output for intelligence:**

      **System information analysis:**

      **From `uname -a`:**
      ```bash
      Linux fin-prod-01 5.4.0-96-generic #108-Ubuntu
      ```
      - Kernel: 5.4.0-96-generic
      - Research: `searchsploit linux kernel 5.4`
      - Potential: Local privilege escalation vulnerabilities

      **From `ps aux`:**
      ```bash
      mysql     1234  0.5  5.2 123456 54321 ?  Ssl  /usr/sbin/mysqld
      root      2345  0.0  0.8  23456  8765 ?  Ss   /usr/sbin/apache2
      ```
      - MySQL running as mysql user (normal)
      - Apache running as root (POTENTIAL SECURITY ISSUE!)
      - Services identified for targeted attacks

      **From `netstat -tulpn`:**
      ```bash
      tcp  0  0  0.0.0.0:22        0.0.0.0:*  LISTEN  834/sshd
      tcp  0  0  127.0.0.1:3306    0.0.0.0:*  LISTEN  1234/mysqld
      tcp  0  0  0.0.0.0:80        0.0.0.0:*  LISTEN  2345/apache2
      ```
      - SSH on port 22 (expected)
      - MySQL on 3306, listening on localhost only (good security)
      - Apache on port 80 (web server)
      - Attack surface: SSH, HTTP

      **From `sudo -l`:**
      ```bash
      User sysadmin may run the following commands on fin-prod-01:
          (ALL : ALL) ALL
      ```
      - Full sudo access!
      - Can execute any command as root
      - Direct privilege escalation path

      **or:**
      ```bash
      User sysadmin may run the following commands on fin-prod-01:
          (root) NOPASSWD: /usr/bin/vim
      ```
      - Can run vim as root without password
      - Privilege escalation via vim: `:!sh`

      **From environment variables:**
      ```bash
      $ env | grep -i pass
      DB_PASSWORD=SecretP@ss123
      ```
      - Credentials in environment!
      - Database access possible

      **Custom script execution:**

      Some systems have custom scripts that reveal information:
      ```bash
      $ ls -la /usr/local/bin/
      -rwxr-xr-x 1 root root 1234 Jan 3 system-info

      $ /usr/local/bin/system-info
      [Custom output with system details]
      ```

      **Checking for custom commands:**
      ```bash
      $ ls -la /usr/local/bin/
      $ ls -la ~/bin/
      $ which system-check
      $ which backup-status
      ```

      **Reading command help/usage:**
      ```bash
      $ /usr/local/bin/system-info --help
      $ /usr/local/bin/system-info -h
      $ /usr/local/bin/system-info
      ```

      **Common custom script patterns:**
      - `system-info`, `sys-info`
      - `backup-status`, `backup-check`
      - `health-check`, `status`
      - `version`, `about`
      - Organization-specific names

      **Finding executables:**
      ```bash
      # In PATH
      $ which python
      /usr/bin/python

      # Everywhere
      $ find / -name "system*" -type f -executable 2>/dev/null

      # In common locations
      $ ls -la /usr/local/bin/
      $ ls -la /opt/
      $ ls -la ~/bin/
      ```

      **Executing found scripts:**
      ```bash
      $ /usr/local/bin/system-info
      $ /opt/custom-app/status.sh
      $ ./script.sh
      ```

      **Environment variable enumeration:**
      ```bash
      # All variables
      $ env

      # Search for specific patterns
      $ env | grep -i pass
      $ env | grep -i key
      $ env | grep -i secret
      $ env | grep -i token

      # Specific variables
      $ echo $DATABASE_URL
      $ echo $API_KEY
      $ echo $SECRET_KEY
      ```

      Careful command output analysis reveals system configuration and security weaknesses.
    unlock_after_minutes: 10

  - text: |
