name: SSH History Analysis
description: FinanceCorp requires investigation of user command history. Analyze bash history files to discover previously executed commands, credentials, and system activity patterns.
difficulty: intermediate
category: post-exploitation
duration_minutes: 120
objectives:
  - Understand bash history file structure
  - Analyze command history for sensitive information
  - Identify credentials in command history
  - Discover internal network information
  - Capture the flag

scenario: |
  Your FinanceCorp penetration test continues with command history analysis. James
  Mitchell wants you to demonstrate the security risks of sensitive information
  in command history files.

  Linux systems maintain a history of commands executed by each user. This history
  is invaluable for penetration testing because users often:
  - Type passwords directly in commands
  - Connect to other systems revealing network topology
  - Execute administrative commands showing privilege levels
  - Access databases with embedded credentials
  - Run scripts that reveal application structure

  Command history files:
  - **~/.bash_history**: Bash command history
  - **~/.mysql_history**: MySQL client history
  - **~/.psql_history**: PostgreSQL client history
  - **~/.python_history**: Python REPL history
  - **~/.ssh/config**: SSH client configuration (not history but related)

  Common sensitive information in history:
  - Passwords in command-line arguments
  - Database connection strings
  - SSH connections to internal systems
  - wget/curl commands with API keys
  - echo commands revealing secrets
  - git commands with repository URLs

  Security implications:
  - History files are world-readable by default (for that user)
  - Commands persist after logout
  - Password reuse can be identified
  - Network topology revealed through SSH history
  - Administrative procedures documented

  Your objective: Authenticate to FinanceCorp's SSH server and analyze the user's
  command history. Look for sensitive information such as passwords, internal
  system addresses, database credentials, and administrative commands that reveal
  privilege levels and attack opportunities.

  **Test Credentials:**
  - Username: `developer`
  - Password: `DevAccess2024#`

flag: "OCR{h1st0ry_l34k}"

hints:
  - text: |
      **Command history analysis** for security assessment:

      **Why command history matters:**
      - **Password exposure**: Users type passwords in commands
      - **Credential discovery**: Database logins, API keys
      - **Network mapping**: SSH connections show internal infrastructure
      - **Privilege identification**: sudo commands reveal capabilities
      - **Application understanding**: Development commands show app structure
      - **Time-based activity**: When and what users do

      **Command history files:**

      **Bash history (.bash_history):**
      - Location: `~/.bash_history`
      - Contains: All bash commands executed by user
      - Persistence: Saved when shell exits, loaded at startup
      - Security risk: HIGH - contains everything user typed

      **MySQL history (.mysql_history):**
      - Location: `~/.mysql_history`
      - Contains: All MySQL client commands
      - Risk: SQL queries with credentials, database structure

      **PostgreSQL history (.psql_history):**
      - Location: `~/.psql_history`
      - Contains: PostgreSQL client commands
      - Risk: Similar to MySQL history

      **Python history (.python_history):**
      - Location: `~/.python_history`
      - Contains: Python REPL commands
      - Risk: API keys, passwords in Python code snippets

      **Common sensitive patterns in history:**

      **1. Passwords in commands:**
      ```bash
      mysql -u root -p'MySecretP@ss123'
      ssh user@server -p password123
      curl -u admin:password http://api.local
      echo 'P@ssw0rd' > credentials.txt
      ```

      **2. Database connections:**
      ```bash
      mysql -h 10.10.10.100 -u dbadmin -p'DbP@ss123' financecorp_db
      psql postgresql://user:pass@10.10.10.100:5432/database
      mongosh mongodb://admin:pass@10.10.10.100:27017/db
      ```

      **3. SSH to internal systems:**
      ```bash
      ssh admin@10.10.10.50
      ssh -i ~/.ssh/id_rsa root@10.10.10.60
      scp file.txt user@10.10.10.70:/tmp/
      ```

      **4. API keys and tokens:**
      ```bash
      curl -H "Authorization: Bearer sk_live_abc123xyz" api.example.com
      export API_KEY=abc123xyz789
      git clone https://token@github.com/private/repo.git
      ```

      **5. Administrative commands:**
      ```bash
      sudo su -
      sudo vim /etc/shadow
      sudo -u postgres psql
      sudo systemctl restart apache2
      ```

      **6. File transfers with credentials:**
      ```bash
      wget http://user:pass@internal.site/file.zip
      curl ftp://admin:password@10.10.10.80/backup.sql
      ```

      **7. Environment variable manipulation:**
      ```bash
      export DB_PASSWORD=SecretP@ss
      export SECRET_KEY=abc123
      export DATABASE_URL=postgresql://user:pass@host/db
      ```

      **8. Git operations:**
      ```bash
      git clone https://username:token@github.com/org/private-repo.git
      git config user.name "John Doe"
      git remote add origin https://token@gitlab.com/project.git
      ```

      **Analyzing history files:**
      - Read complete file: `cat ~/.bash_history`
      - Search for passwords: `grep -i pass ~/.bash_history`
      - Search for SSH: `grep ssh ~/.bash_history`
      - Search for databases: `grep mysql ~/.bash_history`
      - Search for sudo: `grep sudo ~/.bash_history`

      Command history files are treasure troves of sensitive information.
    unlock_after_minutes: 0

  - text: |
      **Accessing and reading bash history:**

      **Location:**
      ```bash
      ~/.bash_history
      # or
      /home/username/.bash_history
      ```

      **Reading history file:**
      ```bash
      $ cat ~/.bash_history
      ls -la
      cd /var/www
      mysql -u root -p'SecretPassword123'
      ssh admin@10.10.10.50
      sudo vim /etc/passwd
      ```

      **Using history command:**
      ```bash
      $ history
        1  ls -la
        2  cd /var/www
        3  mysql -u root -p'SecretPassword123'
        4  ssh admin@10.10.10.50
        5  sudo vim /etc/passwd
      ```
      - Shows numbered list of commands
      - Same content as ~/.bash_history
      - Displays current session commands too

      **Searching history:**

      **Search for specific keywords:**
      ```bash
      # Search for passwords
      $ grep -i pass ~/.bash_history

      # Search for SSH connections
      $ grep ssh ~/.bash_history

      # Search for database commands
      $ grep -E 'mysql|psql|mongo' ~/.bash_history

      # Search for sudo usage
      $ grep sudo ~/.bash_history

      # Search for specific IP addresses
      $ grep '10.10.10' ~/.bash_history

      # Case-insensitive search for API
      $ grep -i api ~/.bash_history
      ```

      **Using history command with grep:**
      ```bash
      $ history | grep mysql
        3  mysql -u root -p'SecretPassword123'
       45  mysql -h 10.10.10.100 -u dbuser -p'DbPass456'
      ```

      **Common search patterns:**

      **Finding credentials:**
      ```bash
      grep -E 'password|passwd|pwd|pass|secret|key|token' ~/.bash_history
      ```

      **Finding network connections:**
      ```bash
      grep -E 'ssh|scp|sftp|rsync' ~/.bash_history
      ```

      **Finding database operations:**
      ```bash
      grep -E 'mysql|psql|mongo|redis|sqlite' ~/.bash_history
      ```

      **Finding API calls:**
      ```bash
      grep -E 'curl|wget|http|api' ~/.bash_history
      ```

      **Analyzing specific command patterns:**

      **MySQL with password:**
      ```bash
      mysql -u root -p'password'
      mysql -h host -u user -ppassword
      ```
      Pattern: `-p` followed immediately by password

      **SSH connections:**
      ```bash
      ssh user@10.10.10.50
      ssh -i keyfile user@hostname
      ```
      Pattern: Shows internal network topology

      **sudo commands:**
      ```bash
      sudo su -
      sudo -u postgres psql
      sudo vim /etc/shadow
      ```
      Pattern: Reveals privilege level

      **Reading other history files:**

      **MySQL history:**
      ```bash
      $ cat ~/.mysql_history
      USE financecorp_db;
      SELECT * FROM users WHERE username='admin';
      SELECT password FROM users;
      CREATE USER 'newuser'@'localhost' IDENTIFIED BY 'P@ssw0rd123';
      ```

      **PostgreSQL history:**
      ```bash
      $ cat ~/.psql_history
      \c financecorp_db
      SELECT * FROM customers;
      \password admin
      ```

      **Python history:**
      ```bash
      $ cat ~/.python_history
      import requests
      api_key = "sk_live_abc123xyz789"
      requests.get(url, headers={"Authorization": f"Bearer {api_key}"})
      ```

      **History file analysis reveals user activities and sensitive credentials.**
