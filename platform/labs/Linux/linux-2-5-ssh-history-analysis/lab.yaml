      **Step 3: Jenkins takeover**
      ```bash
      curl -u devops:D3v0ps_P@ss# \
           http://jenkins.financecorp.local:8080/script
      # Execute groovy scripts = RCE
      ```

      **Step 4: Lateral movement**
      ```bash
      ssh -i ~/.ssh/id_rsa admin@10.10.10.100
      ssh staging@10.10.10.105
      ```

      **Step 5: Redis session hijacking**
      ```bash
      redis-cli -h 10.10.10.102 -a R3d1s_P@ss123
      KEYS *
      # Access all session data
      ```

      **Professional penetration testing report:**

      **FINDING: Root Database Credentials in Bash History**
      - Severity: CRITICAL
      - Credentials: root:R00t_MySQL_2024# @ 10.10.10.100
      - Impact: Complete database compromise, all data accessible
      - Recommendation: NEVER use passwords in command line, use .my.cnf, rotate credentials

      **FINDING: API Keys in Command History**
      - Severity: CRITICAL
      - Key: fc_dev_api_sk_test_xyz789abc123
      - Impact: Unauthorized API access
      - Recommendation: Use environment files, secrets management, rotate API key

      **FINDING: GitHub Token Exposure**
      - Severity: CRITICAL
      - Token: ghp_token_abc123xyz789
      - Impact: Access to private repositories, potential source code theft
      - Recommendation: Revoke token, use SSH keys, never embed tokens in URLs

      **FINDING: Multiple Service Credentials**
      - Severity: CRITICAL
      - Services: Jenkins, Redis, multiple databases
      - Impact: Multi-system compromise
      - Recommendation: Credential vault, no CLI passwords, regular rotation

      **FINDING: Comprehensive Network Topology Disclosure**
      - Severity: MEDIUM
      - Information: All internal servers and services mapped
      - Impact: Aids lateral movement and targeted attacks
      - Recommendation: Limit history retention, use bastion hosts

      **Defense recommendations:**
      1. **NEVER use passwords on command line**
      2. Use configuration files for credentials (.my.cnf, .pgpass)
      3. Implement secrets management (HashiCorp Vault)
      4. Set HISTIGNORE for sensitive commands
      5. Disable history for sensitive shells
      6. Regular history audits
      7. User security training
      8. Rotate all exposed credentials immediately
      9. Implement MFA for all services
      10. Monitor for credential usage

      **Bash history security settings:**

      **Disable history for session:**
      ```bash
      unset HISTFILE
      ```

      **Ignore specific commands:**
      ```bash
      export HISTIGNORE="*password*:*passwd*:*secret*:*key*:*token*"
      ```

      **Disable history completely:**
      ```bash
      echo 'HISTSIZE=0' >> ~/.bashrc
      ```

      **Clear history:**
      ```bash
      history -c                    # Clear session
      rm ~/.bash_history            # Delete file
      ln -s /dev/null ~/.bash_history  # Prevent future writes
      ```

      **Lessons for security:**
      - Command history is permanent record of all activities
      - Users frequently type passwords in commands
      - History reveals complete attack surface
      - Multiple history files exist (bash, mysql, python, etc.)
      - Clearing session history doesn't remove file
      - Network topology easily mapped from SSH history
      - Credentials persist indefinitely in history

      The flag demonstrates that bash history analysis is one of the most valuable
      post-exploitation activities, revealing credentials, network topology, and
      complete user activity patterns.
