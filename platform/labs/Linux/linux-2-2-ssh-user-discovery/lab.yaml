      Email: jmitchell@financecorp.local

      System Access:
        - Production web servers (sudo access)
        - Database servers (read/write)
        - Backup systems (administrator)
        - Financial reporting systems

      SSH Key: /home/jmitchell/.ssh/id_rsa
        Provides access to:
          - fin-db-prod-01 (10.10.10.100)
          - fin-backup-01 (10.10.10.110)
          - fin-reporting-01 (10.10.10.120)

      Notes:
        - User has full sudo privileges on this system
        - Member of 'finance' group with access to sensitive financial data
