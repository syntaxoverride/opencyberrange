      ```

      **Flag location: user_info.txt**
      - **File**: `/home/jmitchell/user_info.txt`
      - **Flag**: `OCR{...}`
      - **Context**: In user information document

      **User enumeration findings:**

      **User identity:**
      - **Username**: jmitchell
      - **UID**: 1001
      - **Full name**: James Mitchell
      - **Role**: Senior Finance Manager / IT Liaison

      **Group memberships:**
      - **jmitchell** (1001): Primary group
      - **sudo** (27): **CRITICAL** - User can run commands as root!
      - **finance** (1002): Department group with sensitive data access

      **File system discoveries:**

      **notes.txt (database credentials exposed!):**
      - Production DB server: 10.10.10.100
      - Staging: 10.10.10.105
      - Backup: 10.10.10.110
      - **Database credentials**: `dbadmin:TempP@ss2024`
      - Lateral movement opportunities identified

      **user_info.txt (comprehensive intelligence):**
      - Complete user profile
      - System access details
      - SSH key location
      - Lateral movement targets listed
      - Sudo privileges confirmed
      - Finance group membership

      **Critical security findings:**

      **1. Excessive privileges:**
      ```bash
      $ id
      groups=1001(jmitchell),27(sudo),1002(finance)
      ```
      - Member of sudo group
      - Full administrative access possible
      - Can escalate to root: `sudo su -`

      **2. Information disclosure:**
      - Plain text database credentials in `notes.txt`
      - Complete network topology in notes
      - User access map in `user_info.txt`
      - SSH key locations documented

      **3. Lateral movement paths:**
      SSH keys provide access to:
      - fin-db-prod-01 (10.10.10.100) - Database server
      - fin-backup-01 (10.10.10.110) - Backup server
      - fin-reporting-01 (10.10.10.120) - Reporting server

      **4. Privilege escalation path:**
      ```bash
      $ sudo -l
      [sudo] password for jmitchell: Finance2024#

      User jmitchell may run the following commands:
          (ALL : ALL) ALL

      $ sudo su -
      [enters password]
      root@fin-prod-web-01:~#
      ```
      Direct path to root access!

      **Real-world attack chain from this information:**

      **Step 1: Initial access (completed)**
      - SSH as jmitchell:Finance2024#

      **Step 2: Enumeration (completed)**
      - Found database credentials
      - Identified lateral movement targets
      - Discovered sudo access

      **Step 3: Privilege escalation**
      ```bash
      sudo su -
      ```
      → Root access on current system

      **Step 4: Lateral movement**
      ```bash
      # Use SSH key to access database server
      ssh -i ~/.ssh/id_rsa dbadmin@10.10.10.100

      # Or use discovered credentials
      mysql -h 10.10.10.100 -u dbadmin -p'TempP@ss2024'
      ```
      → Access to other systems

      **Step 5: Data exfiltration**
      - Access financial data via finance group
      - Database access via lateral movement
      - Backup system access for complete data

      **Professional penetration testing report:**

      **FINDING: Excessive User Privileges**
      - Severity: HIGH
      - User: jmitchell
      - Issue: Member of sudo group with full administrative access
      - Impact: Any compromise of this account = root access
      - Recommendation: Remove sudo access, use role-based access control

      **FINDING: Credentials in Plain Text**
      - Severity: CRITICAL
      - File: /home/jmitchell/notes.txt
      - Issue: Database credentials stored in plain text
      - Credentials: dbadmin:TempP@ss2024
      - Impact: Database compromise, lateral movement
      - Recommendation: Use credential management system, remove plain text credentials

      **FINDING: Information Disclosure**
      - Severity: MEDIUM
      - File: /home/jmitchell/user_info.txt
      - Issue: Detailed system access map, network topology
      - Impact: Assists attacker reconnaissance
      - Recommendation: Limit information in user files, use centralized documentation

      **FINDING: SSH Key Lateral Movement**
      - Severity: HIGH
      - Keys: /home/jmitchell/.ssh/id_rsa
      - Access to: fin-db-prod-01, fin-backup-01, fin-reporting-01
      - Impact: Single compromise = multi-system access
      - Recommendation: Implement jump hosts, key rotation, MFA

      **Defense recommendations:**
      1. Remove jmitchell from sudo group (principle of least privilege)
      2. Implement centralized credential management
      3. Prohibit plain text credential storage
      4. Rotate database passwords immediately
      5. Implement SSH certificate authority
      6. Add MFA for privileged access
      7. Monitor file access in user home directories
      8. Implement data loss prevention for sensitive files

      **Lessons for security:**
      - User home directories often contain sensitive information
      - sudo group membership provides privilege escalation
      - Plain text credentials enable lateral movement
      - Comprehensive enumeration reveals attack paths
      - Information disclosure aids attacker planning

      The flag demonstrates the critical importance of user context enumeration and
      the security risks of storing sensitive information in user directories.
    unlock_after_minutes: 25

