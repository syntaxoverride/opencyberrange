user www-data;
worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    # Honeypot web service. accepts all requests so Suricata can
    # observe complete HTTP transactions and parse payloads.
    access_log off;

    server {
        listen 80 default_server;
        server_name ids-sensor;

        # Return 200 for any path so HTTP transactions complete fully
        # and Suricata's HTTP parser can extract headers, URIs, and bodies.
        location / {
            return 200 '{"status":"ok","service":"Sentinel Defense Corp Internal API","version":"3.1.7"}';
            add_header Content-Type application/json;
        }
    }
}
