services:
  target:
    build:
      context: ./containers/target
      dockerfile: Dockerfile
    hostname: techstart-multi
    labels:
      ip_offset: "10"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 256M
