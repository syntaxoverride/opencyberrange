services:
  target:
    build:
      context: ./containers/target
      dockerfile: Dockerfile
    hostname: financecorp-bak
    labels:
      ip_offset: "10"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
