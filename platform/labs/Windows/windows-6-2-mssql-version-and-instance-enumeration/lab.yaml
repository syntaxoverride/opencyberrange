test:
  steps:
    - name: "Verify MySQL port 3306 is open"
      command: "nmap -Pn -p 3306 {target.target} | grep '3306/tcp'"
      expect: "open"

    - name: "Detect MySQL service version with NSE scripts"
      command: "nmap -Pn -sV --script mysql-info -p 3306 {target.target} 2>&1 | grep -i 'mysql\\|version\\|Protocol'"
      expect: "mysql"

    - name: "Query flag from database"
      command: "mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e 'SELECT content FROM target_db.secrets LIMIT 1' 2>&1"
      expect: "OCR{"
