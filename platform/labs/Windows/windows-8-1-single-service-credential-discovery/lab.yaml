test:
  steps:
    - name: "Verify SMB service is running on port 445"
      command: "nmap -sV -p 445 {target.target}"
      expect: "445/tcp"

    - name: "List SMB shares with credentials"
      command: "smbclient -L //{target.target} -U {cred.admin.user}%{cred.admin.pass} 2>&1"
      expect: "share2"

    - name: "Retrieve flag from share2"
      command: "smbclient //{target.target}/share2 -U {cred.admin.user}%{cred.admin.pass} -c 'get flag.txt -' 2>&1"
      expect: "OCR{cr3d_r3us3_s4m3}"
