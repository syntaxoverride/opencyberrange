test:
  steps:
    - name: "Verify MySQL port 3306 is open"
      command: "nmap -Pn -p 3306 {target.target} | grep '3306/tcp'"
      expect: "open"

    - name: "Authenticate and list databases"
      command: "mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e 'SHOW DATABASES' 2>&1"
      expect: "testdb"

    - name: "Query flag from database"
      command: "mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e 'SELECT flag FROM testdb.flags WHERE id=1' 2>&1"
      expect: "OCR{"
