test:
  steps:
    - name: "Verify SMB and RDP services are running"
      command: "nmap -sV -p 445,3389 {target.target}"
      expect: "445/tcp"

    - name: "Verify HTTP service is accessible"
      command: "curl -s http://{target.target}/"
      expect: "flag"

    - name: "Retrieve flag via HTTP"
      command: "curl -s http://{target.target}/flag.txt"
      expect: "OCR{n3tw0rk_3num}"
