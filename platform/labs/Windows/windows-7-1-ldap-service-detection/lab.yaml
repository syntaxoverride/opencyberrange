test:
  steps:
    - name: "Verify LDAP port 389 is open"
      command: "nmap -Pn -p 389 {target.target} | grep '389/tcp'"
      expect: "open"

    - name: "Detect LDAP service version"
      command: "nmap -Pn -sV -p 389 {target.target} | grep '389/tcp'"
      expect: "ldap"

    - name: "LDAP search for flag"
      command: "ldapsearch -x -H ldap://{target.target} -b 'dc=financecorp,dc=local' description 2>&1 | grep 'OCR{' || (sleep 3 && ldapsearch -x -H ldap://{target.target} -b 'dc=financecorp,dc=local' description 2>&1 | grep 'OCR{')"
      expect: "OCR{"
