name: SMB Comprehensive Null Session Enumeration
description: Complete your FinanceCorp SMB assessment by performing comprehensive enumeration through null sessions.
difficulty: beginner
category: enumeration
duration_minutes: 120
objectives:
  - perform complete enumeration via null session
  - Understand Windows penetration testing techniques
  - Capture the flag

scenario: |
  You're completing the SMB enumeration phase of your FinanceCorp penetration test. 
  James Mitchell has requested a comprehensive enumeration report that demonstrates 
  all information that can be gathered through null session connections.
  
  This final SMB enumeration exercise will combine all techniques you've learned: 
  share enumeration, user enumeration, and system information gathering. FinanceCorp 
  needs this complete picture to understand the full scope of their SMB security 
  posture.
  
  Your objective: Perform comprehensive enumeration of FinanceCorp's SMB service 
  using null sessions. Document all discovered shares, users, groups, and system 
  information. This comprehensive report will conclude your SMB assessment and 
  inform the next phase of your engagement.

flag: "OCR{smb_c0mpl3t3_null}"

hints:
  - text: |
      **Comprehensive null session enumeration** combines all SMB enumeration techniques into a single, thorough assessment. This provides a complete picture of what information is exposed without authentication.

      **What comprehensive enumeration includes:**
      1. **Connection testing**: Verify null session access
      2. **Share enumeration**: Identify all network shares
      3. **User enumeration**: List all user accounts
      4. **Group enumeration**: Discover security groups
      5. **System information**: OS version, domain name, policies
      6. **Password policies**: Complexity requirements, lockout settings

      This complete assessment reveals the full scope of information disclosure vulnerability.
    unlock_after_minutes: 0

  - text: |
      **enum4linux** is the standard tool for automated comprehensive SMB enumeration. It combines all enumeration techniques into a single scan.

      **enum4linux capabilities:**
      - User and group enumeration
      - Share enumeration
      - Password policy extraction
      - OS information gathering
      - Domain/workgroup detection
      - RID cycling for hidden accounts
      - Multiple output formats

      **Key flags:**
      - `-U`: User enumeration
      - `-S`: Share enumeration
      - `-G`: Group enumeration
      - `-P`: Password policy
      - `-a`: All enumeration (comprehensive)
      - `-v`: Verbose output

      **Example comprehensive scan:**
      ```bash
      enum4linux -a target
      ```

      This single command performs all null session enumeration automatically.
    unlock_after_minutes: 5

  - text: |
      **Manual comprehensive enumeration** using rpcclient provides more control and deeper understanding:

      **Essential rpcclient commands for comprehensive enumeration:**

      **1. Server information:**
      ```bash
      srvinfo             # Server details
      querydominfo        # Domain information
      ```

      **2. User enumeration:**
      ```bash
      enumdomusers        # List all users
      queryuser RID       # User details
      ```

      **3. Group enumeration:**
      ```bash
      enumdomgroups       # List groups
      querygroupmem RID   # Group members
      ```

      **4. Share enumeration:**
      ```bash
      netshareenum        # List shares
      netshareenumall     # Extended share info
      ```

      **5. Password policy:**
      ```bash
      getdompwinfo        # Password requirements
      ```

      **Workflow:**
      1. Connect: `rpcclient -U "" -N target`
      2. Run each command systematically
      3. Document all findings
      4. Cross-reference information
    unlock_after_minutes: 10

  - text: |
      **Comprehensive enumeration syntax:**

      **Using enum4linux (automated):**
      ```bash
      enum4linux -a <target>
      ```

      **Using enum4linux with specific options:**
      ```bash
      enum4linux -U -S -G -P <target>     # Specific categories
      enum4linux -a -v <target>           # All + verbose
      enum4linux -a <target> > output.txt # Save to file
      ```

      **Using rpcclient (manual):**
      ```bash
      rpcclient -U "" -N <target> -c 'srvinfo;querydominfo;enumdomusers;enumdomgroups;netshareenum;getdompwinfo'
      ```

      **Interactive comprehensive session:**
      ```bash
      rpcclient -U "" -N <target>
      rpcclient $> srvinfo
      rpcclient $> querydominfo
      rpcclient $> enumdomusers
      rpcclient $> enumdomgroups
      rpcclient $> netshareenum
      rpcclient $> getdompwinfo
      rpcclient $> exit
      ```

      **Alternative tools:**
      ```bash
      smbclient -L //<target> -N          # Basic share listing
      crackmapexec smb <target>           # Modern enumeration tool
      ```
    unlock_after_minutes: 15

  - text: |
      To perform comprehensive null session enumeration on FinanceCorp:

      **Option 1: Automated with enum4linux (recommended for beginners)**
      ```bash
      enum4linux -a <target>
      ```

      This single command:
      - Tests null session connectivity
      - Enumerates users, groups, shares
      - Gathers OS and domain information
      - Extracts password policies
      - Formats output clearly

      **Option 2: Manual with rpcclient (thorough control)**
      ```bash
      rpcclient -U "" -N <target>
      rpcclient $> srvinfo
      rpcclient $> querydominfo
      rpcclient $> enumdomusers
      rpcclient $> enumdomgroups
      rpcclient $> netshareenum
      rpcclient $> getdompwinfo
      ```

      **Option 3: Combined approach**
      ```bash
      # Quick automated scan
      enum4linux -a <target> > enum_output.txt

      # Follow up with manual queries for specific details
      rpcclient -U "" -N <target> -c 'queryuser 0x1f4'
      ```

      Choose based on time available. For comprehensive assessment, enum4linux -a is most efficient.
    unlock_after_minutes: 20

  - text: |
      Comprehensive null session enumeration output example:

      ```bash
      $ enum4linux -a <target_ip>

       ========================
      |    Target Information    |
       ========================
      Target ........... <target_ip>
      RID Range ........ 500-550,1000-1050
      Username ......... ''
      Password ......... ''

       ====================================
      |    Domain/Workgroup Information    |
       ====================================
      [+] Got domain/workgroup name: FINANCECORP

       ===============================
      |    OS Information on <target_ip>   |
       ===============================
      [+] Got OS info for <target_ip> from srvinfo:
      	FINANCECORP    Wk Sv PDC Tim NT
      	platform_id     :	500
      	os version      :	6.1
      	server type     :	0x80102b

       ============================
      |    Users on <target_ip>    |
       ============================
      user:[Administrator] rid:[0x1f4]
      user:[james.mitchell] rid:[0x3e8]
      user:[sarah.chen] rid:[0x3e9]

       ============================
      |    Shares on <target_ip>   |
       ============================
      	Sharename       Type      Comment
      	---------       ----      -------
      	IPC$            IPC       IPC Service
      	Public          Disk      Public Files

       =============================
      |    Password Policy Info    |
       =============================
      [+] Minimum password length: 7
      [+] Password history length: None
      [+] Password complexity: Disabled
      ```

      **What to document in your report:**
      1. **Null session status**: Successful/failed
      2. **Server information**: OS, domain, workgroup
      3. **User accounts**: Complete list with RIDs
      4. **Groups**: Security groups and members
      5. **Shares**: All accessible shares
      6. **Password policy**: Requirements and restrictions
      7. **Security impact**: Risk assessment
      8. **Remediation**: Recommendations to fix

      The flag is related to completing comprehensive enumeration. Look for it in the enum4linux output or through specific rpcclient commands.
    unlock_after_minutes: 25
workbook: "wiki/range/winpt/CH02_SMB_Reconnaissance/08_Comprehensive_Null_Session_Enumeration/"

test:
  steps:
    - name: "Verify SMB port 445 is open"
      command: "nmap -Pn -p 445 {target.target} | grep '445/tcp'"
      expect: "open"

    - name: "Enumerate shares via null session"
      command: "smbclient -L //{target.target} -N 2>&1"
      expect: "public"

    - name: "Enumerate users via rpcclient null session"
      command: "rpcclient -U '' -N {target.target} -c 'enumdomusers' 2>&1"
      expect: "admin"

    - name: "Enumerate domain info via rpcclient null session"
      command: "rpcclient -U '' -N {target.target} -c 'querydominfo' 2>&1"
      expect: "FINANCECORP"

    - name: "Retrieve flag from SMB server string"
      command: "smbclient -L //{target.target} -N 2>&1"
      expect: "OCR{"
