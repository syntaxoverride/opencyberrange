<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCyberRange - Cybersecurity Training Platform</title>
    <script>
      // Apply saved theme immediately to prevent flash of wrong theme
      (function() {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- SOC guided tour: self-contained, class-anchored coach-marks for the
         hunt/triage views. Inert off SOC pages. Served from public/. -->
    <script src="/soc-tour.js"></script>
  </body>
</html>
