# HTTPS server block — activated when certs are mounted at /etc/nginx/certs/
# HTTP (port 80) redirects all traffic to HTTPS (port 443).

# Cache wiki static assets (images/css/js) but keep HTML uncached, so a workbook
# edit shows immediately while images are not re-fetched on every page view.
# Consumed by the generated wiki location blocks via add_header Cache-Control.
map $uri $wiki_cache_control {
    default                                                     "no-cache, no-store, must-revalidate";
    # Fonts, CSS and JS are versioned with ?v=<hash> in mkdocs.yml, so a long
    # TTL is safe: a change moves the URL.
    "~*\.(css|js|woff2?|ttf|eot)$"                              "public, max-age=2592000";
    # Workbook figures are NOT versioned. Their filenames are stable and their
    # contents change on every rebuild, so a long TTL pins a stale screenshot at
    # the CDN for a month. That is exactly what happened after the Flask figures
    # were replaced: the origin held the new capture and Cloudflare kept serving
    # the old one with cf-cache-status HIT. Short TTL, revalidated.
    "~*\.(webp|png|jpe?g|gif|svg|ico)$"                         "public, max-age=300, must-revalidate";
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gcDMZ3reqFDcIeJU3IEsVra//K/ibAKdfKgN6qChfv4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Wiki authentication subrequest ──────────────────────────────
    location = /_wiki_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        set $wiki_token $cookie_wiki_auth;
        proxy_set_header Authorization "Bearer $wiki_token";
    }

    # ── Course-aware wiki auth subrequest ─────────────────────────
    location = /_wiki_course_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/wiki-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        set $wiki_token $cookie_wiki_auth;
        proxy_set_header Authorization "Bearer $wiki_token";
    }

    # ── Admin-only wiki auth subrequest ───────────────────────────
    # Validates JWT AND checks that the user has the admin role.
    # Used by /wiki-admin/ path; returns 200/401/403.
    location = /_wiki_admin_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/wiki-admin-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;

        set $wiki_token $cookie_wiki_auth;
        proxy_set_header Authorization "Bearer $wiki_token";
    }

    # === BEGIN generated wiki blocks (tools/wiki-gen) -- do not edit by hand ===

    # Wiki auth outcomes -> real redirects (see error_page above).
    location @wiki_login {
        return 302 /login;
    }
    location @wiki_denied {
        return 302 /courses;
    }

    # /wiki/ landing index (range tracks only; no chapter content here)
    location = /wiki/ {
        auth_request /_wiki_auth;
        error_page 401 =302 /login;
        error_page 403 =302 /login;

        alias /usr/share/nginx/wiki/;
        index index.html;
        try_files /index.html =404;

        add_header Cache-Control $wiki_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # range/* (student) -- serves any slug in this namespace.
    # Baked at build time: linpt, netfor, webpt, winpt
    location ~ ^/wiki/range/[a-z0-9][a-z0-9._-]*/ {
        auth_request /_wiki_auth;
        # Named locations, not "error_page 401 =302 /login". That form makes
        # nginx serve /login's CONTENT with a 302 status and no Location
        # header, so the browser is told to redirect with nowhere to go and
        # renders a blank page. A named location that returns 302 sends a real
        # Location.
        error_page 401 = @wiki_login;
        # 403 is authenticated but not entitled: not enrolled, or the chapter
        # belongs to a week that has not opened. The course list shows the
        # release dates, so it answers the question they arrive with.
        error_page 403 = @wiki_denied;

        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;

        # HTML stays uncached (a workbook edit shows immediately); static
        # assets (images/css/js) are cacheable so they are not re-downloaded on
        # every page view. Driven by the $wiki_cache_control map on $uri.
        add_header Cache-Control $wiki_cache_control always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # reference/* (student) -- serves any slug in this namespace.
    # Baked at build time: manual
    location ~ ^/wiki/reference/[a-z0-9][a-z0-9._-]*/ {
        auth_request /_wiki_auth;
        # Named locations, not "error_page 401 =302 /login". That form makes
        # nginx serve /login's CONTENT with a 302 status and no Location
        # header, so the browser is told to redirect with nowhere to go and
        # renders a blank page. A named location that returns 302 sends a real
        # Location.
        error_page 401 = @wiki_login;
        # 403 is authenticated but not entitled: not enrolled, or the chapter
        # belongs to a week that has not opened. The course list shows the
        # release dates, so it answers the question they arrive with.
        error_page 403 = @wiki_denied;

        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;

        # HTML stays uncached (a workbook edit shows immediately); static
        # assets (images/css/js) are cacheable so they are not re-downloaded on
        # every page view. Driven by the $wiki_cache_control map on $uri.
        add_header Cache-Control $wiki_cache_control always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # === END generated wiki blocks ===

    # Serve wstunnel binaries
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA entry point
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        access_log /var/log/nginx/access.log;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Vite-hashed assets
    location /assets/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Images/fonts
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
