services:
  firewall:
    build:
      context: ./containers/firewall
      dockerfile: Dockerfile
    hostname: example-fw
    labels:
      ip_offset: "10"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  traffic-gen:
    build:
      context: ./containers/traffic-gen
      dockerfile: Dockerfile
    hostname: apex-dev
    labels:
      ip_offset: "23"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  web-server:
    build:
      context: ./containers/web-server
      dockerfile: Dockerfile
    hostname: example-web
    labels:
      ip_offset: "47"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
