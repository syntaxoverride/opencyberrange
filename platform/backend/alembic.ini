# Alembic configuration for the OCR backend.
#
# The database URL is NOT stored here. env.py reads DATABASE_URL from the
# environment (the same variable the app itself uses), so run alembic from
# platform/backend with DATABASE_URL exported, e.g.:
#
#   DATABASE_URL=postgresql://user:pass@host:5432/db alembic current
#
# Existing deployments (schema created via Base.metadata.create_all plus
# manual ALTER TABLEs) must first be stamped at the baseline:
#
#   alembic stamp 0001_baseline
#
# and only then upgraded.

[alembic]
script_location = alembic
prepend_sys_path = .

# Left intentionally blank; env.py resolves the URL from DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
