; RangeBox Supervisor Configuration
; Alternative to entrypoint.sh for production deployments.
; Provides automatic restart of crashed processes and structured logging.
;
; Usage: Replace ENTRYPOINT in Dockerfile with:
;   ENTRYPOINT ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/rangebox.conf"]

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=Xvfb :1 -screen 0 %(ENV_RESOLUTION)s x16 -ac +extension GLX +render -noreset
environment=RESOLUTION="1280x800"
autorestart=true
priority=100

[program:xfce4]
command=startxfce4
environment=DISPLAY=":1",HOME="/home/kali"
user=kali
autorestart=true
priority=200
startsecs=3

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5900 -nopw -xkb -noxrecord -noxfixes -noxdamage -cursor arrow -nowf
autorestart=true
priority=300
startsecs=2

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=400
startsecs=2
